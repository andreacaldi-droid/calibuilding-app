 const tests=selfTest();$('#view').innerHTML=`<section class="hero"><div class="kicker">PROFILO</div><h1>Cali Power</h1><div class="small muted">CORE 1.0 · Engine CP1 · icona e nome desktop stabili.</div></section><div class="card objective"><strong>MASTER LOCKED</strong><div class="small">${esc(state.master?.goal||'')}</div></div>
 <div class="card"><h3>Dati</h3><div class="actions"><button id="backup" class="btn secondary">BACKUP JSON</button><label class="btn secondary" style="display:flex;align-items:center;justify-content:center">IMPORTA JSON<input id="import" type="file" accept=".json" style="display:none"></label><button id="resetPlan" class="btn secondary">AZZERA SOLO PIANO</button></div></div>
 <div class="card"><h3>Regression guard</h3>${tests.map(([n,ok,t])=>`<div class="timelineItem"><div>${esc(n)}</div><div class="small">${esc(t)}</div><span class="badge ${ok?'ok':'warn'}">${ok?'PASS':'FAIL'}</span></div>`).join('')}</div>
 <div class="card"><h3>Evidence map</h3>${EVIDENCE.map(x=>`<div class="timelineItem"><div>PMID ${x.pmid}</div><div class="small"><b>${esc(x.topic)}</b> · ${esc(x.note)}</div><span class="badge">SOURCE</span></div>`).join('')}</div>
 <div class="card"><h3>Storage</h3><div class="diag">${KEY}<br>History ${state.history.length} · Journal ${state.journal.closedSessions.length}<br>Ultimo verificato ${esc(state.settings.last_verified_training_date||'—')}</div></div>`;
 $('#backup').onclick=backup;$('#resetPlan').onclick=()=>{state.activePlan=null;save();renderProfile()};$('#import').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=migrate(JSON.parse(r.result));save();alert('Import completato. Controlla STORICO prima di allenarti.');nav('history')}catch(err){alert('JSON non valido: '+err.message)}};r.readAsText(f)}
}
function nav(t){$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));if(t==='today')renderToday();if(t==='why')renderWhy();if(t==='history')renderHistory();if(t==='profile')renderProfile()}
$$('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.tab));
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(r=>r.update().catch(()=>{})).catch(()=>{})}
repairJournal(state);save();nav('today');
</script>
