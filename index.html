<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e12">
<link rel="manifest" href="./manifest.webmanifest">
<title>CaliBuilding</title>
<style>
:root{
 --bg:#080b0f;--surface:#10151b;--surface2:#0b1015;--line:#2a3540;--text:#f5f7f8;--muted:#9aa6b2;
 --accent:#c8ff55;--ok:#8cff9c;--warn:#ffcb66;--danger:#ff7e7e;--info:#79dfff;
}
*{box-sizing:border-box} html{background:var(--bg);color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:var(--text);background:#0a1015;border:1px solid var(--line);border-radius:12px;min-height:44px}
input,select,textarea{width:100%;padding:10px 11px} textarea{min-height:86px;resize:vertical}
button{cursor:pointer;padding:10px 13px;font-weight:850}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--info);outline-offset:3px}
button:disabled{opacity:.5;cursor:not-allowed}
.app{max-width:860px;margin:auto;padding:14px 14px 112px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 2px 12px}
.brand{font-weight:950;letter-spacing:-.03em}.build{font-size:10px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.05em}
.badge.ok{color:var(--ok);border-color:#315b3d}.badge.warn{color:var(--warn);border-color:#66552c}.badge.accent{color:var(--accent);border-color:#557039}
.hero,.card{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:14px;margin-bottom:11px}
.hero{background:radial-gradient(circle at 88% 0,rgba(200,255,85,.10),transparent 38%),#0e141a}
.kicker{font-size:10px;font-weight:950;letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(26px,6vw,38px);line-height:1.04;letter-spacing:-.045em;margin:6px 0 8px}
h2,h3{margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px;line-height:1.45}.tiny{font-size:10px;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.field label{display:block;font-size:10px;color:var(--muted);font-weight:800;margin:0 0 5px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.quick button{min-height:36px;border-radius:999px;font-size:11px}
.btn.primary{background:var(--accent);color:#0b0e12;border-color:var(--accent)}.btn.secondary{background:#111820}.btn.danger{border-color:#704040;color:#ffadad}
.full{width:100%}.cta{font-size:15px;min-height:50px}
.objective{border-color:#557039;background:#0e160d}.objective strong{color:var(--accent)}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.metric{border:1px solid var(--line);background:#090e13;border-radius:12px;padding:8px}
.metric span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase}.metric b{font-size:14px}
.plan{border-color:#557039;background:radial-gradient(circle at 90% 0,rgba(200,255,85,.10),transparent 38%),#0e160d}
.planname{font-size:24px;font-weight:950;line-height:1.07;letter-spacing:-.035em;margin:5px 0 8px}
.actions{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;margin-top:10px}
.why{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.why>div{border:1px solid #344234;background:#0a100a;border-radius:11px;padding:8px;font-size:11px}
.forecast{display:grid;grid-template-columns:1fr 1fr;gap:8px}.future{border:1px solid #334552;background:#0b1218;border-radius:14px;padding:10px}
.exercise{border:1px solid var(--line);border-radius:15px;background:#0b1116;padding:11px;margin-bottom:9px}.exhead{display:flex;justify-content:space-between;gap:10px}
.setrow{display:grid;grid-template-columns:58px 1.1fr .8fr .8fr .8fr;gap:6px;align-items:end;margin-top:7px}.setrow input,.setrow select{padding:8px;min-height:40px}
.setlabel{font-size:10px;color:var(--muted);padding-bottom:11px}.doneSet{border-color:#315b3d!important}
.timer{position:sticky;top:8px;z-index:6;border:1px solid #455845;background:rgba(11,18,13,.96);backdrop-filter:blur(10px);border-radius:14px;padding:9px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.timer strong{font-size:22px}.grow{flex:1}
.timeline{display:grid;gap:7px}.timelineItem{border:1px solid var(--line);background:#0a1015;border-radius:13px;padding:9px;display:grid;grid-template-columns:82px 1fr auto;gap:9px;align-items:center}
.integrity{border-color:#315b3d;background:#0c1710}.partial{border-color:#66552c;background:#171309}
.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(860px,100%);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(7,10,13,.96);backdrop-filter:blur(15px);border-top:1px solid var(--line);z-index:30}
.nav button{border:0;background:transparent;font-size:10px;color:var(--muted);min-height:52px}.nav button.active{color:var(--accent)}
dialog{width:min(720px,calc(100% - 24px));border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);padding:14px}
dialog::backdrop{background:rgba(0,0,0,.72)}
details summary{cursor:pointer;font-weight:850;color:var(--muted);padding:7px 0}
.notice{border-left:3px solid var(--warn);padding:8px 10px;background:#171309;border-radius:8px}
.error{border-color:#704040;background:#1a0e0e}.okcard{border-color:#315b3d;background:#0c1710}
@media(max-width:680px){.grid3{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:repeat(3,1fr)}.actions,.why,.forecast{grid-template-columns:1fr}.setrow{grid-template-columns:50px 1fr 1fr}.setrow .pain,.setrow .tech{grid-column:auto}.timelineItem{grid-template-columns:68px 1fr}.timelineItem .badge{grid-column:2}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">CaliBuilding</div><div class="build">STABLE 1.0 · ENGINE S1 · 2026-09-29</div></div><span id="integrityBadge" class="badge ok">STORICO VERIFICATO</span></div>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Navigazione">
  <button data-tab="today" class="active">OGGI</button>
  <button data-tab="why">PERCHÉ</button>
  <button data-tab="history">STORICO</button>
  <button data-tab="profile">PROFILO</button>
</nav>
<div id="live" aria-live="polite" style="position:fixed;left:-9999px;width:1px;height:1px;overflow:hidden"></div>
<dialog id="repairDialog"></dialog>

<script>
'use strict';

const APP_VERSION='stable-1.0';
const ENGINE_VERSION='S1';
const KEY='CALIBUILDING_STABLE_V1';
const LEGACY_KEY='CALIBUILDING_V01_STATE';
const $=q=>document.querySelector(q), $$=q=>[...document.querySelectorAll(q)];
const deep=x=>JSON.parse(JSON.stringify(x));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const isoToday=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const addDays=(date,n)=>{const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);const p=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`};
const dayDiff=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=>`${Date.now()}-${Math.random().toString(16).slice(2)}`;
const announce=s=>{$('#live').textContent='';setTimeout(()=>$('#live').textContent=s,10)};
const fmtDate=d=>{try{return new Intl.DateTimeFormat('it-IT',{weekday:'short',day:'2-digit',month:'2-digit'}).format(new Date(d+'T12:00:00'))}catch{return d}};

const MUSCLES={
 upper_chest:{label:'Petto alto',priority:1.35,target:9.5},
 chest:{label:'Petto',priority:1.0,target:7},
 shoulders:{label:'Spalle',priority:1.30,target:10},
 triceps:{label:'Tricipiti',priority:1.20,target:8},
 biceps:{label:'Bicipiti',priority:1.20,target:7},
 back:{label:'Schiena',priority:1.05,target:9},
 quads:{label:'Quadricipiti',priority:.95,target:7},
 posterior:{label:'Posteriori',priority:1.0,target:7},
 glutes:{label:'Glutei',priority:.85,target:6},
 calves:{label:'Polpacci',priority:.75,target:6},
 core:{label:'Trunk',priority:.90,target:6}
};

const EX={
 feet_elev_weighted_pushup:{name:'Feet-elevated Weighted Push-up',loc:['home','travel'],mus:{upper_chest:1,shoulders:.45,triceps:.55},reps:'6-10',rir:'2 → 1-2',rest:150,kind:'compound'},
 weighted_dips:{name:'Weighted Dips',loc:['home','travel'],mus:{chest:1,triceps:.65,shoulders:.35},reps:'6-10',rir:'2 → 1-2',rest:150,kind:'compound'},
 db_ohp:{name:'Dumbbell Overhead Press',loc:['home','travel'],mus:{shoulders:1,triceps:.5},reps:'6-10',rir:'2',rest:120,kind:'compound'},
 one_arm_db_row:{name:'One-arm Dumbbell Row',loc:['home','travel'],mus:{back:1,biceps:.45},reps:'8-12',rir:'2 → 1-2',rest:105,kind:'compound'},
 pullup:{name:'Pull-up / Weighted Pull-up',loc:['home'],mus:{back:1,biceps:.55},reps:'5-9',rir:'2',rest:150,kind:'compound'},
 trx_row:{name:'TRX Row',loc:['home','travel'],mus:{back:.85,biceps:.35},reps:'8-15',rir:'2',rest:90,kind:'compound'},
 db_lateral_raise:{name:'Dumbbell Lateral Raise',loc:['home','travel'],mus:{shoulders:1},reps:'12-20',rir:'1-2',rest:75,kind:'accessory'},
 trx_reverse_fly:{name:'TRX Reverse Fly',loc:['home','travel'],mus:{shoulders:.7,back:.4},reps:'10-18',rir:'1-2',rest:75,kind:'accessory'},
 hammer_curl:{name:'Dumbbell Hammer Curl',loc:['home','travel'],mus:{biceps:1},reps:'8-15',rir:'2',rest:75,kind:'accessory'},
 band_pressdown:{name:'Band Triceps Pressdown',loc:['home','travel'],mus:{triceps:1},reps:'10-18',rir:'1-2',rest:60,kind:'accessory'},
 back_squat:{name:'Back Squat controllato',loc:['home'],mus:{quads:1,glutes:.55},reps:'5-8',rir:'2 → 1-2',rest:180,kind:'compound'},
 double_db_squat:{name:'Double-Dumbbell Squat controllato',loc:['travel'],mus:{quads:1,glutes:.55},reps:'8-12',rir:'2',rest:150,kind:'compound'},
 barbell_rdl:{name:'Barbell Romanian Deadlift',loc:['home'],mus:{posterior:1,glutes:.55},reps:'6-10',rir:'2 → 1-2',rest:180,kind:'compound'},
 double_db_rdl:{name:'Double-Dumbbell Romanian Deadlift',loc:['travel'],mus:{posterior:1,glutes:.55},reps:'8-12',rir:'2',rest:150,kind:'compound'},
 barbell_hip_thrust:{name:'Barbell Hip Thrust',loc:['home'],mus:{glutes:1,posterior:.35},reps:'8-12',rir:'2',rest:120,kind:'compound'},
 db_floor_glute_bridge:{name:'DB / Backpack Glute Bridge',loc:['travel','home'],mus:{glutes:1,posterior:.25},reps:'10-15',rir:'2',rest:105,kind:'compound'},
 single_leg_calf:{name:'Calf Raise',loc:['home','travel'],mus:{calves:1},reps:'10-18',rir:'1-2',rest:75,kind:'accessory'},
 trx_body_saw:{name:'TRX Body Saw',loc:['home','travel'],mus:{core:1},reps:'8-15',rir:'2',rest:75,kind:'accessory'}
};

const defaultState=()=>({
 schema:1, appVersion:APP_VERSION, engine:ENGINE_VERSION,
 master:{goal:'Molto muscoloso e visibilmente ipertrofico, relativamente asciutto, armonioso ed elegante; mantenere mobilità, coordinazione, agilità e credibilità scenica.'},
 profile:{sex:'male',age:35,height_cm:183,weight_kg:80,experience_years:15},
 constraints:{knee:{baseline:5},elbow:{}},
 equipment:{},
 modalities:{easy_aerobic_enabled:true,intervals_enabled:true,running_available:true,mobility_skill_enabled:true,crossfit_style_enabled:true},
 history:[], ledger:{}, days:{}, activePlan:null, activeWorkout:null,
 journal:{closedSessions:[]}, forecasts:{}, missed:[], physique:{measurements:[]},
 settings:{last_verified_training_date:null}
});

function normalizeExerciseMuscles(e){
 if(EX[e.id]) return EX[e.id].mus;
 const out={};
 for(const m of e.muscles||[]){
  if(MUSCLES[m]) out[m]=1;
  if(m==='lower'){out.quads=.5;out.posterior=.35;out.glutes=.35}
  if(m==='arms'){out.biceps=.5;out.triceps=.5}
 }
 return out;
}
function migrate(raw){
 const s=defaultState();
 if(!raw||typeof raw!=='object')return s;
 // Preserve user-level objects.
 for(const k of ['profile','master','equipment','constraints','modalities','physique']) if(raw[k]) s[k]=deep(raw[k]);
 s.history=Array.isArray(raw.history)?deep(raw.history):[];
 s.ledger=raw.ledger?deep(raw.ledger):{};
 s.settings={...s.settings,...(raw.settings||{})};
 if(raw.v9?.days) s.days=deep(raw.v9.days);
 if(raw.days) s.days=deep(raw.days);
 s.missed=deep(raw.noTrainingDays||raw.missed||[]);
 s.journal=deep(raw.journal||{closedSessions:[]});
 s.forecasts=deep(raw.forecasts||raw.v10?.forecasts||{});
 s.history=s.history.filter(x=>!x.syntheticForecast);
 s.activePlan=null;s.activeWorkout=null;
 s.appVersion=APP_VERSION;s.engine=ENGINE_VERSION;s.schema=1;
 integrityRepair(s);
 return s;
}
function integrityRepair(s){
 s.journal=s.journal||{closedSessions:[]};s.journal.closedSessions=s.journal.closedSessions||[];
 const ids=new Set(s.history.map(x=>String(x.id)));
 for(const sess of s.journal.closedSessions){
  if(sess?.id && !ids.has(String(sess.id))){s.history.push(deep(sess));ids.add(String(sess.id))}
 }
 const trained=new Set(s.history.map(x=>x.date));
 s.missed=(s.missed||[]).filter(x=>!trained.has(x.date));
 s.history.sort((a,b)=>String(a.date).localeCompare(String(b.date))||(+a.endedAt||0)-(+b.endedAt||0));
 if(s.history.length)s.settings.last_verified_training_date=s.history[s.history.length-1].date;
}
let state;
try{
 const stable=localStorage.getItem(KEY);
 if(stable) state=migrate(JSON.parse(stable));
 else {
   const legacy=localStorage.getItem(LEGACY_KEY);
   state=legacy?migrate(JSON.parse(legacy)):defaultState();
 }
}catch(e){state=defaultState()}
save();

function save(){
 state.appVersion=APP_VERSION;state.engine=ENGINE_VERSION;
 localStorage.setItem(KEY,JSON.stringify(state));
 updateIntegrityBadge();
}
function readBack(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function download(name,text){
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)
}
function backup(){download(`CALIBUILDING_STABLE_BACKUP_${isoToday()}.json`,JSON.stringify(state,null,2))}
function updateIntegrityBadge(){
 const el=$('#integrityBadge');if(!el)return;
 const rb=readBack();const ok=!!rb&&Array.isArray(rb.history);
 el.className='badge '+(ok?'ok':'warn');el.textContent=ok?'STORICO VERIFICATO':'VERIFICA STORAGE';
}

function day(date){
 if(!state.days[date])state.days[date]={date,location:'home',minutes:60,event:'none',checkConfirmed:false,sleepQ:5,energy:6,fatigue:4,knee:5,elbow:0,notes:''};
 return state.days[date];
}
function lastSession(){return state.history[state.history.length-1]||null}
function actualSets(ex){
 if(ex.exposureOnly)return 0;
 if(Array.isArray(ex.setlog)){
  const n=ex.setlog.filter(x=>x&&(x.done||x.completed||(+x.reps>0))).length;if(n)return n;
 }
 if(Array.isArray(ex.reps))return ex.reps.filter(x=>+x>0).length;
 return Number.isFinite(+ex.sets)?+ex.sets:0;
}
function lastExposure(exId,date){
 let best=null;
 for(const s of state.history){
  if(s.date>date)continue;
  const e=(s.exercises||[]).find(x=>x.id===exId);if(!e)continue;
  const days=dayDiff(date,s.date);if(days<0)continue;
  const sets=actualSets(e),exposure=sets>0||e.exposureOnly;
  if(exposure&&(!best||s.date>best.session.date))best={session:s,exercise:e,days,sets,exposureOnly:!!e.exposureOnly};
 }
 return best;
}
function muscleStats(date){
 const out={};for(const [k,m] of Object.entries(MUSCLES))out[k]={...m,sets7:0,last:null,demand:0};
 for(const s of state.history){
  const age=dayDiff(date,s.date);if(age<0||age>7)continue;
  for(const e of s.exercises||[]){
   const mus=normalizeExerciseMuscles(e),sets=actualSets(e);
   for(const [m,w] of Object.entries(mus)){
    if(!out[m])continue;
    if(sets>0)out[m].sets7+=sets*w;
    if((sets>0||e.exposureOnly)&&(!out[m].last||s.date>out[m].last))out[m].last=s.date;
   }
  }
 }
 for(const [k,x] of Object.entries(out)){
  const gap=clamp((x.target-x.sets7)/x.target,0,1);
  const ds=x.last?dayDiff(date,x.last):99;
  const rec=ds<=0?.05:ds===1?.38:ds===2?.68:ds===3?.88:1;
  x.days=ds;x.demand=clamp(x.priority*(.72*gap+.28*rec),0,1.35);
 }
 return out;
}
function readiness(ctx){
 let r=(.38*ctx.energy+.34*(10-ctx.fatigue)+.28*ctx.sleepQ)/10;
 if(ctx.knee>5)r-=.035*(ctx.knee-5);
 if(ctx.elbow>3)r-=.025*(ctx.elbow-3);
 if(ctx.newSwelling||ctx.locking||ctx.instability||ctx.functionLoss)r=.15;
 return clamp(r,0,1);
}
function daysSinceMode(date,modeSet){
 for(let i=state.history.length-1;i>=0;i--){
  const s=state.history[i];if(s.date>date)continue;
  if(modeSet.includes(String(s.mode||'')))return dayDiff(date,s.date);
 }
 return 99;
}
function capability(date){
 const aerobic=daysSinceMode(date,['AEROBIC_EASY','CROSSFIT_HYBRID']);
 const intensity=daysSinceMode(date,['INTERVALS','CROSSFIT_HYBRID']);
 const performer=daysSinceMode(date,['PERFORMER_RECOVERY']);
 return {aerobicDays:aerobic,intensityDays:intensity,performerDays:performer,
  aerobicGap:clamp((aerobic-5)/10,0,1),intensityGap:clamp((intensity-8)/14,0,1),performerGap:clamp((performer-5)/10,0,1)};
}
function ctxFor(date){
 const d=day(date);return {date,location:d.location,time:+d.minutes||0,event:d.event||'none',sleepQ:+d.sleepQ||5,energy:+d.energy||6,fatigue:+d.fatigue||4,knee:+d.knee||5,elbow:+d.elbow||0,notes:d.notes||'',
  newSwelling:!!d.newSwelling,locking:!!d.locking,instability:!!d.instability,functionLoss:!!d.functionLoss};
}
function patternPenalty(e,ctx){
 const last=lastExposure(e.id,ctx.date);if(!last)return 1;
 if(last.days<=0)return .05;
 if(last.days===1&&(last.exposureOnly||last.sets>=2))return 0;
 if(last.days===1)return .35;
 if(last.days===2&&last.sets>=3)return .68;
 return 1;
}
function exerciseCandidates(ctx,stats){
 return Object.entries(EX).map(([id,e])=>({id,...e}))
  .filter(e=>e.loc.includes(ctx.location))
  .filter(e=>!(ctx.elbow>=4&&['pullup','hammer_curl'].includes(e.id)))
  .filter(e=>!(ctx.knee>5&&['back_squat','double_db_squat'].includes(e.id)))
  .map(e=>({...e,pen:patternPenalty(e,ctx),value:Object.entries(e.mus).reduce((a,[m,w])=>a+(stats[m]?.demand||0)*w,0)*patternPenalty(e,ctx)}));
}
function buildResistance(ctx,stats){
 let pool=exerciseCandidates(ctx,stats).filter(x=>x.pen>0).sort((a,b)=>b.value-a.value);
 const upper=['upper_chest','chest','shoulders','triceps','biceps','back'];
 const lower=['quads','posterior','glutes','calves','core'];
 const upperD=upper.reduce((a,m)=>a+stats[m].demand,0)/upper.length;
 const lowerD=lower.reduce((a,m)=>a+stats[m].demand,0)/lower.length;
 let focus=upperD>lowerD*1.15?'UPPER + ARMS':lowerD>upperD*1.15?'LOWER / POSTERIOR':'FULL BODY';
 const targetMus=focus.startsWith('UPPER')?upper:focus.startsWith('LOWER')?lower:[...upper,...lower];
 pool=pool.filter(e=>Object.keys(e.mus).some(m=>targetMus.includes(m)));
 const items=[],used=new Set();let min=0;
 const maxMin=Math.max(8,ctx.time);
 for(const e of pool){
  if(used.has(e.id))continue;
  const sets=e.kind==='compound'?3:2;
  const est=sets*((e.rest/60)+.65);
  if(items.length>=2&&min+est>maxMin)continue;
  items.push({...e,sets});used.add(e.id);min+=est;
  if(min>=maxMin*.82||items.length>=7)break;
 }
 if(!items.length&&pool[0])items.push({...pool[0],sets:2});
 return {mode:'RESISTANCE',label:`ADAPTIVE HYPERTROPHY · ${focus}`,estimatedMin:Math.min(ctx.time||20,Math.round(Math.max(min,10))),items,note:'Objective Lock: ipertrofia + estetica restano il fine.'};
}
function easyAerobic(ctx){
 const mins=Math.min(ctx.time,ctx.time>=45?35:Math.max(20,ctx.time-5));
 return {mode:'AEROBIC_EASY',label:'AEROBIC EASY · SUPPORT',estimatedMin:mins,items:[{id:'easy_aerobic',name:'Camminata sostenuta / corsa molto facile',sets:1,reps:`${mins} min`,rir:'RPE 3-4/10',rest:0,nonProgressive:true}],note:'Supporto aerobico a basso costo; non sostituisce hypertrophy work necessario.'};
}
function performer(ctx){
 return {mode:'PERFORMER_RECOVERY',label:'PERFORMER · CONTROL + MOBILITY',estimatedMin:Math.min(ctx.time,25),items:[{id:'performer_block',name:'Controllo scapole + trunk + mobilità attiva',sets:1,reps:`${Math.min(ctx.time,25)} min`,rir:'facile/tecnico',rest:0,nonProgressive:true}],note:'Qualità di movimento, non fatica.'};
}
function hift(ctx,stats){
 const anchor=buildResistance({...ctx,time:Math.max(18,Math.floor(ctx.time*.55))},stats).items.slice(0,1);
 return {mode:'CROSSFIT_HYBRID',label:'HIFT · STRENGTH-BIASED SUPPORT',estimatedMin:Math.min(ctx.time,45),items:[
  ...anchor,
  {id:'hift_quality',name:'HIFT quality block',sets:1,reps:`${ctx.time>=45?14:10} min`,rir:'RPE 7/10',rest:0,nonProgressive:true}
 ],note:'Strength-biased, tecnica > score, nessun salto obbligatorio.'};
}
function intervals(ctx){
 return {mode:'INTERVALS',label:'INTERVALS · CONDITIONING',estimatedMin:Math.min(ctx.time,32),items:[{id:'intervals',name:'Intervalli controllati',sets:6,reps:'1 min forte / 2 min facile',rir:'RPE 7-8/10',rest:120,nonProgressive:true}],note:'Non sprint massimale; conditioning con costo controllato.'};
}
function recovery(ctx){
 return {mode:'RECOVERY',label:'RECOVERY · COSTO MINIMO',estimatedMin:Math.min(ctx.time,20),items:[{id:'recovery_walk',name:'Camminata facile + mobilità attiva',sets:1,reps:`${Math.min(ctx.time,20)} min`,rir:'facile',rest:0,nonProgressive:true}],note:'Oggi il costo di uno stimolo più alto supera il beneficio atteso.'};
}
function decide(ctx){
 const stats=muscleStats(ctx.date),r=readiness(ctx),cap=capability(ctx.date);
 const vals=Object.values(stats).map(x=>x.demand).sort((a,b)=>b-a),top=vals[0]||0,top3=vals.slice(0,3).reduce((a,b)=>a+b,0)/Math.max(1,vals.slice(0,3).length);
 let plan,why=[];
 if(ctx.newSwelling||ctx.locking||ctx.instability||ctx.functionLoss||r<.36){
  plan=recovery(ctx);why=['Safety/readiness gate','Nessun volume-debt'];
 }else if(ctx.time<12){
  if(top>=.55) plan=buildResistance(ctx,stats); else plan=performer(ctx);
  why=[`Tempo reale ${ctx.time} min`,'Micro-dose senza filler'];
 }else if(top>=.48||top3>=.42){
  plan=buildResistance(ctx,stats);why=[`Domanda ipertrofica ${top.toFixed(2)}`,'OBJECTIVE LOCK attivo'];
 }else if(cap.performerGap>=.65&&r>=.55&&ctx.time>=15){
  plan=performer(ctx);why=['Gap controllo/mobilità alto','Costo sistemico basso'];
 }else if(cap.intensityGap>=.7&&r>=.82&&ctx.knee<=5&&ctx.time>=28){
  plan=intervals(ctx);why=['Readiness alta','Gap intensità sufficientemente alto'];
 }else if(cap.aerobicGap>=.55&&r>=.55&&ctx.time>=20){
  plan=easyAerobic(ctx);why=['Domanda ipertrofica bassa','Gap aerobico alto'];
 }else if(state.modalities.crossfit_style_enabled&&r>=.78&&ctx.time>=35&&top<.47&&cap.intensityGap>=.45){
  plan=hift(ctx,stats);why=['HIFT eleggibile','Non sottrae una finestra ipertrofica ad alto valore'];
 }else{
  plan=buildResistance(ctx,stats);why=['Resistance tie-break','MASTER hypertrophy-first'];
 }
 plan.date=ctx.date;plan.readiness=r;plan.stats=stats;plan.why=why;plan.id=uid();plan.engine=ENGINE_VERSION;
 return plan;
}
function forecastFrom(baseDate,assumePlan){
 const clone=deep(state),real=state;
 try{
  state=clone;
  if(assumePlan&&assumePlan.items?.length){
   const sim={id:'SIM-'+assumePlan.id,date:baseDate,mode:assumePlan.mode,focus:assumePlan.label,syntheticForecast:true,
    exercises:assumePlan.items.filter(x=>EX[x.id]).map(x=>({id:x.id,name:x.name,sets:x.sets,reps:Array(x.sets).fill(8),rir:Array(x.sets).fill(2),muscles:Object.keys(x.mus||{})}))};
   state.history.push(sim);
  }
  return decide(ctxFor(addDays(baseDate,1)));
 } finally {state=real}
}

 const dlg=$('#repairDialog');
 dlg.innerHTML=`<h3>Recupera sessione mancante</h3><p class="small muted">Inserisci solo ciò che ricordi. Se non sai set/reps, lascia vuoto: verrà registrata come esposizione, non come volume inventato.</p>
 <div class="grid3"><div class="field"><label>Data</label><input id="rdate" type="date" value="${addDays(isoToday(),-1)}"></div><div class="field"><label>Luogo</label><select id="rloc"><option value="home">Casa</option><option value="travel">Trasferta</option></select></div><div class="field"><label>Durata (fac.)</label><input id="rdur" type="number"></div></div>
 <div class="field"><label>Descrizione</label><input id="rfocus" value="SESSIONE REALE · RECUPERATA"></div>
 ${[0,1,2,3,4,5].map(i=>`<div class="card" style="margin:7px 0;padding:9px"><div class="grid3"><div class="field"><label>Esercizio ${i+1}</label><select id="rex${i}"><option value="">—</option>${Object.entries(EX).map(([id,e])=>`<option value="${id}">${esc(e.name)}</option>`).join('')}</select></div><div class="field"><label>Set (se ricordi)</label><input id="rsets${i}" type="number" min="1"></div><div class="field"><label>Nota</label><input id="rnote${i}" placeholder="carico/reps/RIR se ricordi"></div></div></div>`).join('')}
 <div class="actions"><button id="rsave" class="btn primary">SALVA DATI CONFERMATI</button><button id="rcancel" class="btn secondary">ANNULLA</button></div>`;
 dlg.showModal();$('#rcancel').onclick=()=>dlg.close();$('#rsave').onclick=()=>{
  const date=$('#rdate').value;if(!date)return;
  const exercises=[];for(let i=0;i<6;i++){const id=$(`#rex${i}`).value;if(!id)continue;const n=+$(`#rsets${i}`).value||0;exercises.push({id,name:EX[id].name,muscles:Object.keys(EX[id].mus),sets:n||null,reps:[],rir:[],exposureOnly:!n,note:$(`#rnote${i}`).value||''})}
  const sess={id:uid(),date,location:$('#rloc').value,focus:$('#rfocus').value||'SESSIONE REALE · RECUPERATA',mode:'RESISTANCE',duration_min:+$('#rdur').value||null,partial:true,source:'manual_recovery',exercises,post:{}};
  state.history.push(sess);integrityRepair(state);save();dlg.close();renderHistory();
 };
}
function renderProfile(){
 $('#view').innerHTML=`<section class="hero"><div class="kicker">PROFILO</div><h1>CaliBuilding</h1><div class="small muted">STABLE 1.0 · Engine S1. Il nome e l'icona desktop non contengono più il numero di versione.</div></section>
 <div class="card objective"><strong>MASTER LOCKED</strong><div class="small" style="margin-top:5px">${esc(state.master?.goal||defaultState().master.goal)}</div></div>
 <div class="card"><h3>Dati</h3><div class="actions"><button id="backup" class="btn secondary">BACKUP JSON</button><label class="btn secondary" style="display:flex;align-items:center;justify-content:center">IMPORTA JSON<input id="import" type="file" accept=".json" style="display:none"></label><button id="resetPlan" class="btn secondary">AZZERA SOLO PIANO</button></div><p class="tiny muted">Il backup include storico + journal di sicurezza. Non esistono checkpoint separati non esportati.</p></div>
 <div class="card"><h3>Stato storage</h3><div class="small">Chiave: ${KEY}<br>History ${state.history.length} · Journal ${state.journal.closedSessions.length}<br>Ultimo verificato ${esc(state.settings.last_verified_training_date||'—')}</div></div>`;
 $('#backup').onclick=backup;$('#resetPlan').onclick=()=>{state.activePlan=null;save();renderProfile()};
 $('#import').onchange=ev=>{const f=ev.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=migrate(JSON.parse(r.result));localStorage.setItem(KEY,JSON.stringify(state));alert('Import completato. Controlla STORICO prima di allenarti.');nav('history')}catch(e){alert('JSON non valido: '+e.message)}};r.readAsText(f)};
}
function nav(tab){
 $$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 if(tab==='today')renderToday();if(tab==='why')renderWhy();if(tab==='history')renderHistory();if(tab==='profile')renderProfile();
}
$$('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.tab));

if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
integrityRepair(state);save();nav('today');
</script>
</body></html>
