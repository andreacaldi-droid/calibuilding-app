  const today=todayISO();
  const anchor=(state.currentCheck?.date && Math.abs(daysBetween(state.currentCheck.date,today))<=3)
    ? state.currentCheck.date : today;

  (state.calendar||[]).slice(0,4).forEach((r,i)=>{
    const date=cbV9DateAdd(anchor,i);
    const d=cbV9EnsureDay(date);
    if(!d._legacyMigrated){
      d.location=r.location||d.location;
      d.minutes=Number.isFinite(+r.minutes)?+r.minutes:d.minutes;
      d.event=cbV9SanitizeEvent(r.event);
      d.notes=r.notes||d.notes||'';
      d._legacyMigrated=true;
    }
  });

  const c=state.currentCheck||{};
  if(c.date){
    const d=cbV9EnsureDay(c.date);
    if(!d.checkConfirmed){
      d.location=c.location||d.location;
      d.minutes=Number.isFinite(+c.time)?+c.time:d.minutes;
      d.event=cbV9SanitizeEvent(c.event||d.event);
      d.sleepH=Number.isFinite(+c.sleepH)&&+c.sleepH>0?+c.sleepH:null;
      d.sleepQ=Number.isFinite(+c.sleepQ)?+c.sleepQ:d.sleepQ;
      d.energy=Number.isFinite(+c.energy)?+c.energy:d.energy;
      d.fatigue=Number.isFinite(+c.fatigue)?+c.fatigue:d.fatigue;
      d.knee=Number.isFinite(+c.knee)?+c.knee:d.knee;
      d.elbow=Number.isFinite(+c.elbow)?+c.elbow:d.elbow;
      d.newSwelling=!!c.newSwelling;d.locking=!!c.locking;d.instability=!!c.instability;d.functionLoss=!!c.functionLoss;
      d.checkConfirmed=true;d.checkedAt=Date.now();
    }
  }

  for(let i=0;i<4;i++)cbV9EnsureDay(cbV9DateAdd(today,i));
}
function cbV9SyncLegacyHorizon(baseDate=todayISO()){
  state.calendar=[];
  for(let i=0;i<4;i++){
    const d=cbV9EnsureDay(cbV9DateAdd(baseDate,i));
    state.calendar.push({offset:i,location:d.location,minutes:+d.minutes||0,event:cbV9SanitizeEvent(d.event),notes:d.notes||''});
  }
  const d=cbV9EnsureDay(baseDate);
  if(d.checkConfirmed){
    state.currentCheck={date:baseDate,location:d.location,time:+d.minutes||0,sleepH:+d.sleepH||0,
      sleepQ:+d.sleepQ||5,energy:+d.energy||6,fatigue:+d.fatigue||4,knee:+d.knee||5,
      elbow:Number.isFinite(+d.elbow)?+d.elbow:0,event:cbV9SanitizeEvent(d.event),
      newSwelling:!!d.newSwelling,locking:!!d.locking,instability:!!d.instability,functionLoss:!!d.functionLoss,notes:d.notes||''};
  }
}
function cbV9Ctx(date=todayISO(),provisional=true){
  const d=cbV9EnsureDay(date);
  const prev=cbV9LastKnownCheck(date)||{};
  const pick=(x,y,z)=>Number.isFinite(+x)?+x:(Number.isFinite(+y)?+y:z);
  return {
    date,
    location:d.location||prev.location||'home',
    time:+d.minutes||0,
    sleepH:pick(d.checkConfirmed?d.sleepH:null,prev.sleepH,0),
    sleepQ:pick(d.checkConfirmed?d.sleepQ:null,prev.sleepQ,5),
    energy:pick(d.checkConfirmed?d.energy:null,prev.energy,6),
    fatigue:pick(d.checkConfirmed?d.fatigue:null,prev.fatigue,4),
    knee:pick(d.checkConfirmed?d.knee:null,prev.knee,5),
    elbow:pick(d.checkConfirmed?d.elbow:null,prev.elbow,0),
    event:cbV9SanitizeEvent(d.event),
    tomorrowEvent:cbV9SanitizeEvent(cbV9EnsureDay(cbV9DateAdd(date,1)).event),
    newSwelling:d.checkConfirmed?!!d.newSwelling:!!prev.newSwelling,
    locking:d.checkConfirmed?!!d.locking:!!prev.locking,
    instability:d.checkConfirmed?!!d.instability:!!prev.instability,
    functionLoss:d.checkConfirmed?!!d.functionLoss:!!prev.functionLoss,
    notes:d.notes||'',
    provisional:!d.checkConfirmed && provisional
  };
}
currentCtx=function(){return cbV9Ctx(todayISO(),false)};

function cbV9Horizon(ctx){
  const rows=[];
  for(let i=0;i<4;i++){
    const date=cbV9DateAdd(ctx.date,i),d=i===0?{minutes:ctx.time,location:ctx.location,event:ctx.event}:cbV9EnsureDay(date);
    const min=+d.minutes||0;
    let eventFactor=1;
    if(d.event==='tennis')eventFactor=.72;
    if(d.event==='show')eventFactor=.86;
    if(d.event==='travel')eventFactor=.82;
    rows.push({offset:i,date,minutes:min,location:d.location||ctx.location,event:cbV9SanitizeEvent(d.event),score:clamp((min/60)*eventFactor,0,1)});
  }
  const future=rows.slice(1);
  const best=future.reduce((a,b)=>b.score>a.score?b:a,{score:0,minutes:0,offset:1,event:'none'});
  const total=future.reduce((a,b)=>a+b.minutes,0);
  return {days:rows,best,tomorrow:rows[1],total,scarcity:clamp(1-total/180,0,1)};
}
cbA6Horizon=function(ctx){return cbV9Horizon(ctx)};

/* ---------- MASTER-vector audit layer ---------- */
const CB_A9_MODE_VECTOR={
  RESISTANCE:{hypertrophy:1.00,strength:.88,control:.18,athletic:.10,conditioning:.04,mobility:.03,cost:.22},
  RESISTANCE_LIGHT:{hypertrophy:.68,strength:.55,control:.18,athletic:.08,conditioning:.03,mobility:.04,cost:.13},
  CROSSFIT_HYBRID:{hypertrophy:.43,strength:.52,control:.34,athletic:.72,conditioning:.72,mobility:.16,cost:.28},
  AEROBIC_EASY:{hypertrophy:.03,strength:.01,control:.04,athletic:.18,conditioning:.78,mobility:.08,cost:.06},
  INTERVALS:{hypertrophy:.02,strength:.03,control:.05,athletic:.68,conditioning:1.00,mobility:.03,cost:.27},
  PERFORMER_RECOVERY:{hypertrophy:.01,strength:.02,control:1.00,athletic:.52,conditioning:.12,mobility:1.00,cost:.05},
  RECOVERY:{hypertrophy:0,strength:0,control:.05,athletic:.03,conditioning:.02,mobility:.12,cost:-.10}
};
function cbA9Needs(ctx,ms){
  const ds=Object.values(ms).map(x=>x.demand).sort((a,b)=>b-a);
  const top=ds[0]||0,top3=avg(ds.slice(0,3))||0;
  const upper=Math.max(ms.upper_chest?.demand||0,ms.shoulders?.demand||0,ms.biceps?.demand||0,ms.triceps?.demand||0);
  const lower=Math.max(ms.quads?.demand||0,ms.posterior?.demand||0,ms.glutes?.demand||0);
  const hypertrophy=clamp(.45*top+.30*top3+.15*upper+.10*lower,0,1.25);
  const lastResistance=cbA8LastModeDays(ctx,'RESISTANCE');
  const lastAerobic=Math.min(cbA8LastModeDays(ctx,'AEROBIC_EASY'),cbA8LastModeDays(ctx,'INTERVALS'),cbA8LastModeDays(ctx,'CROSSFIT_HYBRID'));
  const lastPerformer=cbA8LastModeDays(ctx,'PERFORMER_RECOVERY');
  const lastAthletic=Math.min(cbA8LastModeDays(ctx,'INTERVALS'),cbA8LastModeDays(ctx,'CROSSFIT_HYBRID'),lastPerformer);
  return {
    hypertrophy,
    aesthetics:clamp(.62*upper+.38*Math.max(top3,.25),0,1.2),
    strength:clamp(lastResistance/5,.18,1),
    control:clamp(lastPerformer/10,.18,1),
    athletic:clamp(lastAthletic/10,.18,1),
    conditioning:clamp(lastAerobic/12,.15,1),
    mobility:clamp(lastPerformer/9,.20,1)
  };
}
function cbA9MasterFit(mode,needs){
  const v=CB_A9_MODE_VECTOR[mode]||CB_A9_MODE_VECTOR.RESISTANCE;
  // User-specific software objective weights, NOT biological constants.
  return (
    .44*needs.hypertrophy*v.hypertrophy +
    .20*needs.aesthetics*v.hypertrophy +
    .13*needs.strength*v.strength +
    .09*needs.control*v.control +
    .07*needs.athletic*v.athletic +
    .04*needs.conditioning*v.conditioning +
    .03*needs.mobility*v.mobility
  );
}
function cbA9Calibration(mode){
  const x=state.v9?.modeCalibration?.[mode];
  if(!x||!x.n)return {factor:1,confidence:0,n:0};
  const confidence=x.n/(x.n+6);
  const raw=clamp(x.ema||1,.88,1.12);
  return {factor:1+(raw-1)*confidence,confidence,n:x.n};
}
function cbA9Scenarios(ctx,ms){
  const base=cbA7Scenarios(ctx,ms);
  const needs=cbA9Needs(ctx,ms);
  return base.map(s=>{
    const fit=cbA9MasterFit(s.mode,needs);
    const cal=cbA9Calibration(s.mode);
    let score=.72*s.score+.28*fit;
    score*=cal.factor;

    // MASTER guards: secondary modalities never steal a high-value hypertrophy window.
    if(needs.hypertrophy>=.56 && !['RESISTANCE','RESISTANCE_LIGHT'].includes(s.mode))score*=.78;
    if(needs.aesthetics>=.58 && s.mode==='INTERVALS')score*=.80;
    if(needs.hypertrophy>=.66 && s.mode==='CROSSFIT_HYBRID')score*=.82;

    return {...s,score,masterFit:fit,calibration:cal,needs};
  }).sort((a,b)=>b.score-a.score);
}

    );
    if(alt){
      experiment={id:'exp-'+Date.now(),type:'A9_CONTROLLED_EXPLORATION',chosen:alt.mode,control:chosen.mode,
        predictedChosen:alt.score,predictedControl:chosen.score,uncertainty:1-(alt.modeModel?.confidence||0),status:'PLANNED'};
      chosen=alt;
    }
  }
  return {mode:chosen.mode,why:`A9: ${chosen.mode} massimizza il valore atteso rispettando il MASTER e le prossime 72 h.`,
    sys,h,scenarios,needs:chosen.needs,experiment};
}
function cbA9Plan(ctx){
  const ms=cbA6MuscleStates(ctx),md=cbA9Choose(ctx,ms),phase=cbPhysiqueSignal();
  let p;
  if(md.mode==='GATE')p=cbA6GatePlan(ctx,ms,md);
  else if(md.mode==='RECOVERY')p=cbA6RecoveryPlan(ctx,ms,md);
  else if(md.mode==='AEROBIC_EASY')p=cbEasyAerobicPlan(ctx,ms,md.why);
  else if(md.mode==='INTERVALS')p=cbIntervalsPlan(ctx,ms,md.why);
  else if(md.mode==='PERFORMER_RECOVERY')p=cbPerformerRecoveryPlan(ctx,ms,md.why);
  else if(md.mode==='CROSSFIT_HYBRID')p=cbA8CrossfitPlan(ctx,ms,md);
  else p=cbA6ResistancePlan(ctx,ms,md,md.mode==='RESISTANCE_LIGHT');

  p.phase=phase;p.analysis=p.analysis||{};
  p.analysis.a9={sys:md.sys,horizon:md.h,scenarios:md.scenarios||[],needs:md.needs,experiment:md.experiment};
  p.analysis.muscles=ms;
  p.analysis.personal=p.analysis.personal||[];
  p.analysis.inference=p.analysis.inference||[];
  p.analysis.personal.unshift(md.why);
  p.analysis.inference.push('A9 mantiene il MASTER esplicito: ipertrofia/estetica dominano; multidisciplinarita e performer sono strumenti subordinati.');
  p.analysis.inference.push('Il planner e date-based: nessun calendario viene fatto scorrere solo perche una seduta viene chiusa.');
  p.analysis.inference.push('Le previsioni future sono condizionali: diventano prescrizioni solo dopo il CHECK del giorno reale.');
  if(md.experiment){p.experiment=md.experiment;p.analysis.inference.push('Controlled exploration attiva: alternativa quasi equivalente, sicura e ad alta incertezza.');}
  return p;
}

/* ---------- plan stability and audit ---------- */
function cbV9ContextSignature(ctx){
  return cbHashString(JSON.stringify({
    date:ctx.date,location:ctx.location,time:ctx.time,sleepH:ctx.sleepH,sleepQ:ctx.sleepQ,
    energy:ctx.energy,fatigue:ctx.fatigue,knee:ctx.knee,elbow:ctx.elbow,event:ctx.event,
    flags:[ctx.newSwelling,ctx.locking,ctx.instability,ctx.functionLoss],
    horizon:cbV9Horizon(ctx).days.map(x=>({date:x.date,minutes:x.minutes,location:x.location,event:x.event})),
    historyCount:(state.history||[]).length,noTrainingCount:(state.noTrainingDays||[]).length,
    engine:'A9',version:VERSION
  }));
}
function cbV9PlanIsCurrent(plan,ctx){
  return !!plan && plan._v9Signature===cbV9ContextSignature(ctx);
}
function cbV9Decision(ctx){
  cbV9SyncLegacyHorizon(ctx.date);
  const p=buildPlan(ctx);
  p._v9Signature=cbV9ContextSignature(ctx);
  p._decisionMeta=p._decisionMeta||{};
  p._decisionMeta.engine='A9';p._decisionMeta.appVersion=VERSION;
  p._decisionMeta.fingerprint=cbHashString(p._v9Signature+'|'+p.mode+'|'+p.label+'|'+(p.items||[]).map(x=>x.id+':'+x.sets).join(','));
  state.activePlan=p;
  state.v9.decisionLog.push({date:ctx.date,at:Date.now(),id:p._decisionMeta.fingerprint,signature:p._v9Signature,mode:p.mode,label:p.label});
  state.v9.decisionLog=state.v9.decisionLog.slice(-40);
  save();
  return p;
}

/* ---------- forecasting without mutating real history ---------- */
function cbV9SyntheticSession(plan,ctx){
  return {
    id:'FORECAST-'+ctx.date+'-'+(plan.mode||'MODE'),date:ctx.date,location:ctx.location,
    focus:plan.label,mode:plan.mode,duration_min:plan.estimatedMin||ctx.time,syntheticForecast:true,
    pre:{...ctx},post:{fatigue:5,quality:5,pump:{chest:0,shoulders:0,arms:0}},
    exercises:(plan.items||[]).map(e=>({
      id:e.id,name:e.name,muscles:e.muscles||[],sets:+e.sets||1,
      rir:Array.from({length:+e.sets||1},()=>2),tech:'clean',pain:0
    }))
  };
}
function cbV9Forecast(offset){
  const real=state;
  try{
    const tmp=deepClone(state);
    tmp.a8=tmp.a8||{};tmp.a8.explorationEnabled=false;
    state=tmp;
    let prevPlan=real.activePlan?deepClone(real.activePlan):null;
    let prevCtx=cbV9Ctx(todayISO(),true);
    const todayDone=(real.history||[]).some(s=>s.date===todayISO());
    const todayMissed=(real.noTrainingDays||[]).some(x=>x.date===todayISO());

    if(!todayDone && !todayMissed && prevPlan && !['RECOVERY','GATE'].includes(prevPlan.mode)){
      state.history.push(cbV9SyntheticSession(prevPlan,prevCtx));
    }

    let result=null;
    for(let i=1;i<=offset;i++){
      const date=cbV9DateAdd(todayISO(),i);
      cbV9SyncLegacyHorizon(date);
      const ctx=cbV9Ctx(date,true);
      result=cbA9Plan(ctx);
      if(i<offset && result && !['RECOVERY','GATE'].includes(result.mode)){
        state.history.push(cbV9SyntheticSession(result,ctx));
      }
    }
    return result?deepClone(result):null;
  }catch(e){return null}
  finally{state=real}
}

/* ---------- adapt time while session is already active ---------- */
function cbV9CompletedSetCount(log){return (log?.sets||[]).filter(s=>s?.completed||(+s?.reps>0)).length}
function cbV9ChangeActiveTime(){
  const w=state.activeWorkout;if(!w)return;
  try{captureLogs()}catch(e){}
  const elapsed=Math.max(0,(Date.now()-w.startedAt)/60000);
  const v=prompt('Minuti TOTALI che puoi dedicare oggi (incluso il tempo già trascorso):',String(w.ctx.time||30));
  if(v===null)return;
  const total=Math.max(1,+v||1),remain=Math.max(0,total-elapsed);
  const any=Object.values(w.logs||{}).some(l=>cbV9CompletedSetCount(l)>0);

  const d=cbV9EnsureDay(todayISO());d.minutes=total;d.checkConfirmed=true;d.checkedAt=Date.now();
  cbV9SyncLegacyHorizon(todayISO());

  if(!any){
    state.activeWorkout=null;state.activePlan=null;
    cbV9Decision(cbV9Ctx(todayISO(),false));save();renderToday();return;
  }

  // Preserve completed work. Trim only future/uncompleted work to the remaining budget.
  let budget=remain,items=[];
  for(const e of w.plan.items){
    const done=cbV9CompletedSetCount(w.logs[e.id]||{});
    if(done>0){
      const keep=deepClone(e);keep.sets=done;items.push(keep);
    }
  }
  const candidates=w.plan.items.filter(e=>cbV9CompletedSetCount(w.logs[e.id]||{})<e.sets)
    .map(e=>({e,done:cbV9CompletedSetCount(w.logs[e.id]||{}),value:e.engineValue||.5}))
    .sort((a,b)=>(b.value||0)-(a.value||0));

  for(const c of candidates){
    const per=Math.max(1.5,cbSetMinutes(c.e,false));
    const possible=Math.max(0,Math.floor(budget/per));
    if(possible<=0)continue;
    const n=Math.min(c.e.sets-c.done,possible);
    let existing=items.find(x=>x.id===c.e.id);
    if(existing)existing.sets+=n;else{existing=deepClone(c.e);existing.sets=n;items.push(existing)}
    budget-=n*per;
  }

  w.ctx.time=total;w.plan.items=items;w.plan.estimatedMin=Math.round(total-Math.max(0,budget));
  w.plan.note=`Tempo adattato durante la seduta: ${Math.round(elapsed)} min trascorsi, piano residuo ridotto senza perdere le serie già eseguite.`;
  w.timeAdjustedAt=Date.now();save();renderWorkout();
}

/* ---------- A10 self-calibration from next real CHECK ---------- */
function cb10CalibratePreviousWithCheck(ctx){
  const hist=(state.history||[]).filter(s=>s.date<ctx.date).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const prev=hist[0];if(!prev)return;
  const gap=daysBetween(ctx.date,prev.date);
  if(gap<1||gap>3)return;
  if(state.v10.nextDayCalibrated[prev.id])return;

  const sys=cbA6SystemicReadiness(ctx);
  const mode=prev.mode||cbA8ModeFromSession(prev);
  const q=+prev.post?.quality||5,f=+prev.post?.fatigue||5;
  // Conservative, bounded evidence update. This is a software heuristic, not biology.
  const observed=clamp(1 + .035*((q-5)/5) - .035*((f-5)/5) + .055*(sys.score-1),.92,1.08);
  const old=state.v9.modeCalibration?.[mode]||{n:0,ema:1};
  const alpha=.12; // deliberately small: one morning cannot rewrite the model
  state.v9.modeCalibration=state.v9.modeCalibration||{};
  state.v9.modeCalibration[mode]={n:(old.n||0)+1,ema:(1-alpha)*(old.ema||1)+alpha*observed,lastDate:prev.date,nextCheckDate:ctx.date};
  state.v10.nextDayCalibrated[prev.id]={date:ctx.date,systemic:sys.score,observed};
}

/* ---------- A10 mode scoring: objective hierarchy + confidence guard ---------- */
function cb10Scenarios(ctx,ms){
  const base=cbA9Scenarios(ctx,ms),needs=cbA9Needs(ctx,ms),sys=cbA6SystemicReadiness(ctx),h=cbV9Horizon(ctx);
  const out=base.map(s=>{
    const conf=Math.max(s.modeModel?.confidence||0,s.calibration?.confidence||0);
    // Data personalization has bounded leverage. Low confidence can barely move the result.
    const personalBound=.015+.045*conf;
    const personalRaw=clamp((s.modeModel?.factor||1)*(s.calibration?.factor||1),1-personalBound,1+personalBound);
    let score=s.score*personalRaw;

    // Hard objective hierarchy: secondary methods are tools, never the objective.
    const hardHypertrophy=needs.hypertrophy>=.60 || needs.aesthetics>=.62;
    if(hardHypertrophy && !['RESISTANCE','RESISTANCE_LIGHT'].includes(s.mode)) score*=.76;
    if(needs.hypertrophy>=.70 && s.mode==='CROSSFIT_HYBRID')score*=.78;
    if(needs.hypertrophy>=.55 && s.mode==='INTERVALS')score*=.74;

    // Preserve a scarce future hypertrophy window only when future opportunity really is scarce.
    if(['RESISTANCE','RESISTANCE_LIGHT'].includes(s.mode) && h.scarcity>.55)score*=1.06;

    // Complexity tie breaker is applied later, not hidden in the score.
    return {...s,scoreA10:score,confidence:conf,personalFactor:personalRaw,hardHypertrophy};
  }).sort((a,b)=>b.scoreA10-a.scoreA10);
  return {rows:out,needs,sys,h};
}
function cb10Choose(ctx,ms){
  if(redFlag(ctx))return {mode:'GATE',why:'Safety gate: nuovo cambiamento funzionale/articolare.',...cb10Scenarios(ctx,ms)};
  const pack=cb10Scenarios(ctx,ms);
  if(ctx.energy<=2||ctx.fatigue>=9||ctx.sleepQ<=2||pack.sys.score<.66)
    return {mode:'RECOVERY',why:'Readiness sistemica insufficiente: il beneficio atteso del training non giustifica il costo.',...pack};

  const rows=pack.rows;
  if(!rows.length)return {mode:'RESISTANCE',why:'Fallback resistance: nessuna modalità secondaria eleggibile.',...pack};

  let first=rows[0];
  const tied=rows.filter(x=>x.scoreA10>=first.scoreA10*.98);
  if(tied.length>1){
    // Stability/interpretability: within a 2% software tie, prefer MASTER fit, then lower fatigue cost.
    tied.sort((a,b)=>(b.masterFit-a.masterFit)||((CB_A9_MODE_VECTOR[a.mode]?.cost||0)-(CB_A9_MODE_VECTOR[b.mode]?.cost||0)));
    first=tied[0];
  }

  let experiment=null;
  if(state.a8?.explorationEnabled && !cbA8ExperimentRecently() && pack.sys.score>=.97){
    const alt=rows.find(x=>x.mode!==first.mode && x.scoreA10>=first.scoreA10*.985 &&
      x.confidence<.35 && x.masterFit>=first.masterFit*.97 &&
      !['INTERVALS','RECOVERY'].includes(x.mode));
    if(alt){
      experiment={id:'exp-'+Date.now(),type:'A10_CONTROLLED_EXPLORATION',chosen:alt.mode,control:first.mode,
        predictedChosen:alt.scoreA10,predictedControl:first.scoreA10,uncertainty:1-alt.confidence,status:'PLANNED'};
      first=alt;
    }
  }

  return {
    mode:first.mode,
    why:`A10: ${first.mode} massimizza il valore atteso entro i vincoli del MASTER.`,
    chosen:first,experiment,...pack
  };
}
function cb10Plan(ctx){

  if(md.experiment){p.experiment=md.experiment;p.analysis.inference.push('Controlled exploration: alternativa quasi equivalente, sicura e ad alta incertezza.');}
  return p;
}

/* ---------- "what happens tomorrow" branches ---------- */
function cb10ForecastScenario(offset,assumption){
  const real=state;
  try{
    const tmp=deepClone(state);
    tmp.a8=tmp.a8||{};tmp.a8.explorationEnabled=false;
    state=tmp;

    const today=todayISO(),todayDone=(state.history||[]).some(s=>s.date===today),todayMissed=(state.noTrainingDays||[]).some(x=>x.date===today);
    if(!todayDone&&!todayMissed){
      if(assumption==='complete' && real.activePlan && !['RECOVERY','GATE'].includes(real.activePlan.mode)){
        state.history.push(cbV9SyntheticSession(real.activePlan,cbV9Ctx(today,true)));
      }
      if(assumption==='missed'){
        state.noTrainingDays=state.noTrainingDays||[];
        state.noTrainingDays.push({id:'FORECAST-MISS',date:today,type:'PRESCRIBED_NOT_EXECUTED',reason:'forecast',prescribedMode:real.activePlan?.mode||null});
      }
    }

    let result=null;
    for(let i=1;i<=offset;i++){
      const date=cbV9DateAdd(today,i);
      cbV9SyncLegacyHorizon(date);
      const ctx=cbV9Ctx(date,true);
      result=cb10Plan(ctx);
      if(i<offset && result && !['RECOVERY','GATE'].includes(result.mode)){
        state.history.push(cbV9SyntheticSession(result,ctx));
      }
    }
    return result?deepClone(result):null;
  }catch(e){return null}
  finally{state=real}
}

importState=function(ev){
  const f=ev.target.files?.[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);
      if(!j.master||!Array.isArray(j.history))throw Error('schema');
      cb10Checkpoint('before_import');
      state=j;
      cb10Ensure();
      state.activePlan=null;
      CB_REMOTE_APPLY=true;cbLocalPersist();CB_REMOTE_APPLY=false;
      alert('Stato importato e migrato a V10.');
      nav('today');
    }catch(e){alert('File stato non valido.')}
  };
  r.readAsText(f);
};

/* =========================================================
   V10.1 — OBJECTIVE LOCK + VERIFIED HYBRID SUPPORT
   Integrates useful hybrid-training principles without
   adopting a fixed 3-strength/3-run week or "different-day"
   dogma. MASTER remains the hard hierarchy.
   ========================================================= */

const CB101={
  build:'2026-09-28',
  evidence:{
    concurrentWholeMuscle:'PMID 36508686',
    concurrentFibers:'PMID 35476184',
    concurrentCompatibility:'PMC8891239',
    umbrellaConcurrent:'PMID 41762427',
    zone2Review:'PMID 40560504',
    hift:'PMID 39930392'
  }
};

function cb101DaysSinceFamily(ctx,family){
  const hist=state.history||[];
  const match=(s)=>{
    const m=String(s.mode||cbA8ModeFromSession(s)||'').toUpperCase();
    if(family==='aerobic_base') return m==='AEROBIC_EASY' || m==='CROSSFIT_HYBRID';
    if(family==='high_intensity') return m==='INTERVALS' || m==='CROSSFIT_HYBRID';
    if(family==='hybrid') return m==='CROSSFIT_HYBRID';
    if(family==='control') return m==='PERFORMER_RECOVERY';
    if(family==='resistance') return m==='RESISTANCE' || m==='RESISTANCE_LIGHT';
    return false;
  };
  for(let i=hist.length-1;i>=0;i--){
    if(match(hist[i]))return Math.max(0,daysBetween(ctx.date,hist[i].date));
  }
  return 99;
}

function cb101CapabilityGaps(ctx){
  const a=cb101DaysSinceFamily(ctx,'aerobic_base');
  const hi=cb101DaysSinceFamily(ctx,'high_intensity');
  const hy=cb101DaysSinceFamily(ctx,'hybrid');
  const co=cb101DaysSinceFamily(ctx,'control');
  const rt=cb101DaysSinceFamily(ctx,'resistance');
  return {
    days:{aerobic:a,intensity:hi,hybrid:hy,control:co,resistance:rt},
    // Coaching heuristics only. They create a maintenance signal, not a rigid weekly quota.
    aerobic:clamp((a-4)/10,0,1),
    intensity:clamp((hi-7)/14,0,1),
    hybrid:clamp((hy-8)/16,0,1),
    control:clamp((co-4)/10,0,1)
  };
}

function cb101Rows(ctx,ms){
  const pack=cb10Scenarios(ctx,ms);
  const gaps=cb101CapabilityGaps(ctx);
  const rows=pack.rows.map(r=>{
    let support=1;
    if(r.mode==='AEROBIC_EASY')support+=.07*gaps.aerobic;
    if(r.mode==='INTERVALS')support+=.055*gaps.intensity;
    if(r.mode==='CROSSFIT_HYBRID')support+=.05*Math.max(gaps.hybrid,gaps.intensity);
    if(r.mode==='PERFORMER_RECOVERY')support+=.075*gaps.control;
    return {...r,score101:r.scoreA10*support,supportFactor:support,gaps};
  }).sort((a,b)=>b.score101-a.score101);
  return {...pack,rows,gaps};
}

function cb101Choose(ctx,ms){
  if(redFlag(ctx)){
    const pack=cb101Rows(ctx,ms);
    return {mode:'GATE',why:'Safety gate: prima la funzione reale.',...pack,objectiveLocked:true};
  }
  const pack=cb101Rows(ctx,ms);
  if(ctx.energy<=2||ctx.fatigue>=9||ctx.sleepQ<=2||pack.sys.score<.66)
    return {mode:'RECOVERY',why:'Readiness troppo bassa per uno stimolo produttivo.',...pack,objectiveLocked:true};

  const rows=pack.rows;
  if(!rows.length)return {mode:'RESISTANCE',why:'Fallback resistance.',...pack,objectiveLocked:true};

  const resistanceRows=rows.filter(x=>['RESISTANCE','RESISTANCE_LIGHT'].includes(x.mode));
  const bestResistance=resistanceRows.sort((a,b)=>b.score101-a.score101)[0]||null;

  // HARD PRIMARY-OBJECTIVE LOCK:
  // if hypertrophy/aesthetic demand is meaningfully high, an eligible resistance
  // option wins. Conditioning cannot "outscore" the primary goal merely because
  // it has been absent for several days.
  const highPrimary =
    pack.needs.hypertrophy>=.52 ||
    pack.needs.aesthetics>=.56 ||
    (pack.h.scarcity>.55 && pack.needs.hypertrophy>=.42);

  let chosen;
  let objectiveLocked=false;
  if(highPrimary && bestResistance){
    chosen=bestResistance;
    objectiveLocked=true;
  }else{
    chosen=rows[0];
    const tied=rows.filter(x=>x.score101>=chosen.score101*.98);
    if(tied.length>1){
      tied.sort((a,b)=>(b.masterFit-a.masterFit)||((CB_A9_MODE_VECTOR[a.mode]?.cost||0)-(CB_A9_MODE_VECTOR[b.mode]?.cost||0)));
      chosen=tied[0];
    }
  }

  // Exploration can never break the primary lock.
  let experiment=null;
  if(!objectiveLocked && state.a8?.explorationEnabled && !cbA8ExperimentRecently() && pack.sys.score>=.97){
    const alt=rows.find(x=>x.mode!==chosen.mode && x.score101>=chosen.score101*.985 &&
      x.confidence<.35 && x.masterFit>=chosen.masterFit*.97 &&
      !['INTERVALS','RECOVERY'].includes(x.mode));
    if(alt){
      experiment={id:'exp-'+Date.now(),type:'A10_1_CONTROLLED_EXPLORATION',chosen:alt.mode,control:chosen.mode,
        predictedChosen:alt.score101,predictedControl:chosen.score101,uncertainty:1-alt.confidence,status:'PLANNED'};
      chosen=alt;
    }
  }

  return {
    mode:chosen.mode,
    why:objectiveLocked
      ? `OBJECTIVE LOCK: domanda ipertrofia/estetica sufficientemente alta; ${chosen.mode} resta prioritario.`
      : `A10.1: ${chosen.mode} offre il miglior valore atteso senza violare il MASTER.`,
    chosen,experiment,objectiveLocked,...pack
  };
}

function cb101LowerDominance(plan){
  let lower=0,total=0;
  for(const e of plan.items||[]){
    const sets=+e.sets||1;
    const mus=e.muscles||[];
    const isLower=mus.some(m=>['quads','posterior','glutes','calves'].includes(m));
    total+=sets;if(isLower)lower+=sets;
  }
  return total?lower/total:0;
}

function cb101MaybeAttachSupport(plan,ctx,md){
  if(!['RESISTANCE','RESISTANCE_LIGHT'].includes(plan.mode))return plan;
  const spare=Math.max(0,(+ctx.time||0)-(+plan.estimatedMin||0));
  if(spare<7 || md.sys.score<.90 || ctx.fatigue>6)return plan;

  const gaps=md.gaps||cb101CapabilityGaps(ctx);
  const lowerDominance=cb101LowerDominance(plan);
  let item=null,minutes=0,reason='';

  // Useful, low-cost support only. Never fill time for its own sake.
  if(gaps.control>=.58 && spare>=7){
    minutes=Math.min(8,Math.floor(spare));
    item={
      id:'performer_support_v101',name:'Performer support · controllo + mobilità attiva',
      sets:1,reps:`${minutes} min`,rir:'facile / tecnico',rest:0,logType:'duration',nonProgressive:true,
      muscles:['performance'],loadHint:'Scapole, torace, anche/caviglie e locomozione controllata. Nessuno stretching aggressivo.',
      note:'Supporto Chechi/performer a basso costo. Non è volume ipertrofico.'
    };
    reason='gap controllo/mobilità sufficientemente alto';
  }else if(gaps.aerobic>=.62 && spare>=10 && ctx.knee<=5 && lowerDominance<.50){
    minutes=Math.min(15,Math.floor(spare));
    item={
      id:'aerobic_support_v101',name:'Aerobic easy support · talk test',
      sets:1,reps:`${minutes} min`,rir:'RPE 3-4/10',rest:0,logType:'duration',nonProgressive:true,
      muscles:['conditioning'],
      loadHint:state.modalities?.running_available
        ? 'Camminata molto rapida o corsa facile: conversazione possibile, nessuna ricerca del passo. Se il ginocchio cambia rispetto al baseline, passa alla camminata.'
        : 'Camminata rapida / marcia facile: conversazione possibile. Nessuna ricerca del passo.',
      note:'Supporto aerobico, non “brucia-grassi”. Intensità facile guidata da talk-test/RPE.'
    };
    reason='base aerobica poco esposta e costo marginale basso';
  }

  if(item){
    plan.items.push(item);
    plan.estimatedMin=Math.min(ctx.time,(+plan.estimatedMin||0)+minutes);
    plan.analysis=plan.analysis||{};
    plan.analysis.inference=plan.analysis.inference||[];
    plan.analysis.inference.push(`Support block aggiunto: ${reason}. È lavoro indipendentemente utile, non riempitivo.`);
    plan.hybridSupport={type:item.id,minutes,reason};
  }
  return plan;
}

cb10Plan=function(ctx){
  const ms=cbA6MuscleStates(ctx),md=cb101Choose(ctx,ms),phase=cbPhysiqueSignal();
  let p;
  if(md.mode==='GATE')p=cbA6GatePlan(ctx,ms,md);
  else if(md.mode==='RECOVERY')p=cbA6RecoveryPlan(ctx,ms,md);
  else if(md.mode==='AEROBIC_EASY')p=cbEasyAerobicPlan(ctx,ms,md.why);
  else if(md.mode==='INTERVALS')p=cbIntervalsPlan(ctx,ms,md.why);
  else if(md.mode==='PERFORMER_RECOVERY')p=cbPerformerRecoveryPlan(ctx,ms,md.why);
  else if(md.mode==='CROSSFIT_HYBRID')p=cbA8CrossfitPlan(ctx,ms,md);
  else p=cbA6ResistancePlan(ctx,ms,md,md.mode==='RESISTANCE_LIGHT');

  p.phase=phase;
  p.analysis=p.analysis||{};
  p.analysis.a101={
    sys:md.sys,horizon:md.h,scenarios:md.rows||[],needs:md.needs,
    chosen:md.chosen||null,experiment:md.experiment||null,
    objectiveLocked:!!md.objectiveLocked,gaps:md.gaps
  };
  p.analysis.muscles=ms;
  p.analysis.personal=p.analysis.personal||[];
  p.analysis.inference=p.analysis.inference||[];
  p.analysis.personal.unshift(md.why);
  p.analysis.inference.push('V10.1 non usa una settimana 3 forza + 3 corsa: usa gap di capacità + MASTER + storico reale.');
  p.analysis.inference.push('Forza e endurance non devono per forza cadere in giorni separati: un support block può seguire resistance solo se ha valore marginale e basso costo.');
  p.analysis.inference.push('Zona 2 non è trattata come intensità magica: aerobic easy usa talk-test/RPE e resta uno strumento.');
  p.analysis.inference.push('CrossFit/HIFT resta strength-biased e non può superare l’OBJECTIVE LOCK quando la domanda ipertrofica/estetica è alta.');
  if(md.experiment){p.experiment=md.experiment;p.analysis.inference.push('Controlled exploration attiva senza violare l’objective lock.');}

  return cb101MaybeAttachSupport(p,ctx,md);
};

buildPlan=function(ctx){
  const p=cb10Plan(ctx);
  return cbAttachDecisionMeta(p,ctx);
};
