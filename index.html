<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<link rel="manifest" href="manifest.webmanifest">
<title>CaliBuilding V10.1</title>
<style>
:root{
  --bg:#090b0e;--panel:#11151a;--panel2:#161b21;--line:#242b33;--txt:#f4f6f8;--muted:#96a0aa;
  --accent:#c8ff55;--accent2:#70e1f5;--warn:#ffcb66;--bad:#ff6b6b;--ok:#8cff9c;--blue:#6bb6ff;
  --radius:18px;--shadow:0 16px 40px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#090b0e,#0d1116 45%,#0a0d11);color:var(--txt);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:820px;margin:0 auto;padding:18px 16px 110px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{font-weight:900;letter-spacing:-.04em;font-size:25px}
.brand span{color:var(--accent)}
.version{font-size:12px;color:var(--muted)}
.hero{background:radial-gradient(circle at 80% 0%,rgba(200,255,85,.14),transparent 35%),var(--panel);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:800}
h1{font-size:34px;line-height:1.02;margin:8px 0 10px;letter-spacing:-.045em}
h2{font-size:22px;letter-spacing:-.025em;margin:0 0 10px}
h3{font-size:16px;margin:0 0 8px}
p{line-height:1.48;margin:7px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:12px}
.card.soft{background:var(--panel2)}
.stat{padding:13px;border-radius:15px;background:#0d1116;border:1px solid var(--line)}
.stat .v{font-size:22px;font-weight:850}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:#171d23;border:1px solid var(--line);font-size:12px;color:#dbe1e6}
.chip.ok{border-color:#315d39;color:var(--ok)}
.chip.warn{border-color:#684f24;color:var(--warn)}
.chip.bad{border-color:#6a2f33;color:#ff9a9a}
.chip.accent{border-color:#546a24;color:var(--accent)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:850;background:#20262d;color:var(--txt)}
.btn.primary{background:var(--accent);color:#11150d}
.btn.secondary{background:#14191f;border:1px solid var(--line)}
.btn.danger{background:#251416;border:1px solid #5d2d32;color:#ff9a9a}
.btn.full{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.field{margin-top:10px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:700}
input,select,textarea{width:100%;background:#0d1116;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#526333}
.sep{height:1px;background:var(--line);margin:14px 0}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(820px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(8,10,13,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:8px 6px max(8px,env(safe-area-inset-bottom));z-index:20}
.nav button{border:0;background:transparent;color:#7f8993;font-size:10px;padding:8px 3px;border-radius:12px}
.nav button b{display:block;font-size:18px;margin-bottom:2px}
.nav button.active{color:var(--accent);background:rgba(200,255,85,.07)}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.num{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#1d242b;color:var(--accent);font-weight:900}
.title{font-weight:850}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.callout{border-radius:14px;padding:12px 13px;margin-top:10px;border:1px solid var(--line);background:#0d1116}
.callout.ok{border-color:#305b3b;background:#101b14}
.callout.warn{border-color:#66522b;background:#1d1810}
.callout.red{border-color:#633036;background:#1f1114}
.callout.blue{border-color:#2e4e68;background:#0f1820}
.masterlock{border:1px solid #4f6128;background:linear-gradient(135deg,#151a12,#101512)}
.excard{background:#0d1116;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.exhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.prescription{font-size:13px;color:#dfe5e9;margin-top:5px}
.setgrid{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr .9fr;gap:6px;margin-top:10px}
.setgrid .head{font-size:10px;color:var(--muted);text-align:center}
.setgrid input,.setgrid select{padding:8px 7px;border-radius:9px;text-align:center}
.timer{font-size:42px;font-weight:900;letter-spacing:-.05em;text-align:center;padding:12px 0}
.progressbar{height:6px;background:#1b2229;border-radius:99px;overflow:hidden}
.progressbar > div{height:100%;background:var(--accent);width:0}
.badge{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.badge.promote{color:var(--ok)} .badge.consolidate{color:var(--blue)}
.badge.hold{color:var(--warn)} .badge.adapt{color:#ffd27a} .badge.regress{color:#ff8b8b}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:left;font-size:12px;vertical-align:top}
th{color:var(--muted);font-weight:700}
details{margin-top:8px}
summary{cursor:pointer;color:#dfe4e8;font-weight:700}
.banner{padding:11px 13px;border-radius:14px;margin-bottom:12px;background:#1b1710;border:1px solid #5f4d26;color:#f4d892}
@media(max-width:600px){
  .app{padding:14px 12px 100px}.grid,.grid3{grid-template-columns:1fr}
  h1{font-size:30px}.hero{padding:18px}.setgrid{grid-template-columns:1.1fr .9fr .9fr .9fr .9fr}
  .setgrid input,.setgrid select{font-size:12px;padding:7px 4px}
}

.musclegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.musclebox{background:#0d1116;border:1px solid var(--line);border-radius:13px;padding:10px}
.musclebox .top{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.musclebar{height:5px;background:#1d242b;border-radius:99px;overflow:hidden;margin-top:7px}
.musclebar>div{height:100%;background:var(--accent);border-radius:99px}
.engineTag{display:inline-flex;padding:5px 8px;border-radius:999px;border:1px solid #4e6127;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.08em}
.logicline{display:grid;grid-template-columns:74px 1fr;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}
.logicline:last-child{border-bottom:0}
.logicline b{font-size:10px;letter-spacing:.08em;color:var(--muted)}
@media(max-width:600px){.musclegrid{grid-template-columns:1fr}}


.physiqueHero{background:radial-gradient(circle at 90% 0%,rgba(112,225,245,.12),transparent 32%),var(--panel)}
.kpirow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.kpi{background:#0d1116;border:1px solid var(--line);border-radius:14px;padding:11px}
.kpi .big{font-size:20px;font-weight:900;letter-spacing:-.03em}
.modecard{border:1px solid #35455a;background:#0e151d}
.phasecard{border:1px solid #4d5f2c;background:#12180f}
.protocol{font-size:11px;color:var(--muted);line-height:1.45}
@media(max-width:600px){.kpirow{grid-template-columns:1fr 1fr}}


.cloudcard{border:1px solid #315a66;background:linear-gradient(135deg,#0e171b,#10151b)}
.cloudrow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.cloudstatus{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:11px;font-weight:850}
.cloudstatus.on{border-color:#315d39;color:var(--ok)}
.cloudstatus.syncing{border-color:#66522b;color:var(--warn)}
.cloudstatus.off{color:var(--muted)}
.syncCode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all;background:#080b0e;border:1px solid var(--line);border-radius:12px;padding:10px}


/* v0.6 Session Runner */
.setblock{margin-top:10px;padding:9px;border:1px solid #242d35;border-radius:13px;background:#0a0e12}
.setblock.done{border-color:#315b3d;background:#0c1510}
.setblock .setlabel{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}
.setDoneBtn{width:100%;margin-top:8px}
.setDoneBtn.done{border-color:#315b3d;color:var(--ok);background:#0c1a11}
.restPanel{margin-top:12px;padding:12px;border:1px solid #2b3b48;border-radius:15px;background:#0b1218}
.restPanel.active{border-color:#5c6d34;background:#11170d}
.restMeta{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.restClock{font-size:39px;font-weight:950;letter-spacing:-.05em;line-height:1;text-align:center;padding:8px 0}
.restProgress{height:7px;background:#202830;border-radius:99px;overflow:hidden;margin:7px 0 10px}
.restProgress>div{height:100%;width:0;background:var(--accent);transition:width .2s linear}
.restBtns{display:grid;grid-template-columns:1.3fr .7fr .7fr .8fr;gap:7px}
.draftStatus{font-size:10px;color:var(--muted);text-align:right;margin-top:7px}
.runnerSticky{position:sticky;top:7px;z-index:8;background:rgba(13,17,22,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;padding:9px 11px;margin-bottom:10px}
.runnerSticky .small{margin:0}
@media(max-width:600px){
  .restBtns{grid-template-columns:1fr 1fr}
  .setblock{padding:8px}
  .restClock{font-size:35px}
}


/* v0.7 A6 personalized adaptive coach */
.a6grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.a6box{border:1px solid var(--line);background:#0b1015;border-radius:14px;padding:10px}
.a6box .score{font-weight:950;font-size:18px}
.confbar{height:6px;background:#202830;border-radius:99px;overflow:hidden;margin-top:7px}
.confbar>div{height:100%;background:var(--accent)}
.a6notice{border:1px solid #38516b;background:#0b141e;border-radius:12px;padding:9px;margin-top:8px}
.a6advice{border:1px solid #48582e;background:#10160d;border-radius:11px;padding:8px;margin:8px 0;font-size:11px}
.a6stop{border-color:#6b3636;background:#190d0d}
@media(max-width:700px){.a6grid{grid-template-columns:1fr}}


/* v0.8 A7 predictive + A8 self-calibrating */
.a8scenario{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.a8mode{border:1px solid var(--line);background:#0b1015;border-radius:14px;padding:10px}
.a8mode.win{border-color:#526c2e;background:#10170d}
.a8mode .modeScore{font-size:19px;font-weight:950}
.a8tag{display:inline-flex;padding:4px 7px;border:1px solid #55662f;border-radius:999px;color:var(--accent);font-size:9px;font-weight:900;letter-spacing:.06em}
.a8experiment{border:1px solid #65552a;background:#171409;border-radius:12px;padding:9px;margin-top:8px}
@media(max-width:700px){.a8scenario{grid-template-columns:1fr}}


/* v0.8.1 navigation / safety hotfix */
.backCheckBar{margin:10px 0 12px;padding:10px;border:1px solid #4a5865;border-radius:14px;background:#0d1319}
.backCheckBar .btn{width:100%}
.buildCard{border:1px solid #36586b;background:#0c141a}


/* v0.8.2 no-training + decision audit */
.noTrainCard{border:1px solid #66532c;background:#171309}
.noTrainBtn{border-color:#6a5b38!important}
.auditCard{border:1px solid #36586b;background:#0c141a}
.auditId{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;word-break:break-all}
.previewCard{border:1px solid #46634a;background:#0d1710}


/* =========================================================
   v0.9 — low-friction cockpit + A9 audit/predictive UX
   ========================================================= */
.cockpit{display:grid;gap:12px}
.flowbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 12px}
.flowstep{padding:8px 5px;border-radius:12px;border:1px solid var(--line);background:#0b1015;text-align:center;font-size:9px;font-weight:900;color:var(--muted)}
.flowstep.on{border-color:#496934;color:var(--accent);background:#10170d}
.flowstep.done{border-color:#315b3d;color:var(--ok)}
.todayGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.todayGrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.quickTimes{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.quickTimes button{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:#10161c;color:var(--text);font-size:11px;font-weight:850}
.quickTimes button.active{border-color:#5c7637;color:var(--accent)}
.primaryAction{font-size:15px;padding:14px 16px}
.planHero{border:1px solid #496934;background:radial-gradient(circle at 90% 0%,rgba(143,201,78,.13),transparent 35%),#0d1410}
.planMode{font-size:10px;font-weight:950;letter-spacing:.10em;color:var(--accent);text-transform:uppercase}
.planTitle{font-size:24px;font-weight:950;line-height:1.08;letter-spacing:-.035em;margin:5px 0 8px}
.actionGrid{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:8px;margin-top:11px}
.futureGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.futureCard{border:1px solid #354653;background:#0b1218;border-radius:14px;padding:10px}
.futureCard .fmode{font-weight:950;font-size:14px;margin:4px 0}
.provisional{display:inline-flex;padding:3px 7px;border-radius:99px;border:1px solid #62542d;color:var(--warn);font-size:9px;font-weight:900}
.statusOk{display:inline-flex;padding:4px 8px;border-radius:99px;border:1px solid #315b3d;color:var(--ok);font-size:10px;font-weight:900}
.statusNeed{display:inline-flex;padding:4px 8px;border-radius:99px;border:1px solid #66552c;color:var(--warn);font-size:10px;font-weight:900}
.masterStrip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.masterPoint{padding:8px;border:1px solid var(--line);border-radius:12px;background:#0a0f14;font-size:10px;text-align:center}
.why3{display:grid;gap:7px;margin-top:9px}
.why3>div{padding:8px 9px;background:#0a0f14;border:1px solid var(--line);border-radius:11px;font-size:11px}
.modeGuide{border:1px solid #3b5060;background:#0b131a}
.stalePlan{border-color:#6d5a2e!important}
.microAction{font-size:11px;padding:8px 10px}
.historyDone{border:1px solid #315b3d;background:#0d1710}
.missedDone{border:1px solid #66552c;background:#171309}
.a9Audit{border:1px solid #3d5361;background:#0c141a}
.a9Score{font-size:20px;font-weight:950}
.a9ScenarioRow{display:grid;grid-template-columns:1.2fr .7fr .7fr .7fr;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.a9ScenarioRow:last-child{border-bottom:0}
.timeAdaptBar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
@media(max-width:700px){
  .todayGrid,.todayGrid.two,.futureGrid,.actionGrid,.masterStrip{grid-template-columns:1fr 1fr}
  .actionGrid .primary{grid-column:1/-1}
  .a9ScenarioRow{grid-template-columns:1fr .7fr .7fr}
  .a9ScenarioRow .hideMobile{display:none}
}
@media(max-width:430px){
  .todayGrid,.todayGrid.two{grid-template-columns:1fr 1fr}
  .futureGrid{grid-template-columns:1fr}
  .masterStrip{grid-template-columns:1fr 1fr}
}


/* =========================================================
   CALIBUILDING V10 — FINAL PRODUCT LAYER
   Usability/accessibility + A10 decision architecture.
   ========================================================= */
:root{
  --v10-surface:#10151b;
  --v10-surface2:#0b1015;
  --v10-border:#2b3540;
  --v10-accent:#c8ff55;
  --v10-info:#70e1f5;
  --v10-ok:#8cff9c;
  --v10-warn:#ffcb66;
  --v10-danger:#ff7a7a;
  --v10-focus:#b7ecff;
}
html{scroll-behavior:smooth}
body{font-size:16px}
button,input,select,textarea{font-size:16px;min-height:44px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{
  outline:3px solid var(--v10-focus);outline-offset:3px
}
.btn{min-height:46px}
.nav button{min-height:54px}
.card,.hero{box-shadow:0 12px 32px rgba(0,0,0,.20)}
.v10Shell{display:grid;gap:12px}
.v10Top{
  background:
    radial-gradient(circle at 88% 0%,rgba(200,255,85,.11),transparent 34%),
    radial-gradient(circle at 0% 100%,rgba(112,225,245,.07),transparent 34%),
    #0e141a;
  border:1px solid #33414d
}
.v10Kicker{font-size:10px;font-weight:950;letter-spacing:.13em;color:var(--v10-accent);text-transform:uppercase}
.v10Title{font-size:clamp(25px,6vw,38px);font-weight:950;line-height:1.04;letter-spacing:-.045em;margin:6px 0}
.v10Lead{color:var(--muted);font-size:13px;line-height:1.45}
.v10Now{
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:11px
}
.v10Metric{padding:9px;border:1px solid var(--line);border-radius:13px;background:#090e13}
.v10Metric b{display:block;font-size:15px;margin-top:2px}
.v10Metric span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.v10SectionHead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
.v10SectionHead h3{margin:0}
.v10Step{
  display:inline-flex;align-items:center;justify-content:center;min-width:31px;height:31px;
  border-radius:999px;background:#1a242d;border:1px solid #354553;font-size:12px;font-weight:950
}
.v10Step.on{background:#1a2610;border-color:#587434;color:var(--accent)}
.v10CompactGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.v10Quick{display:flex;gap:7px;flex-wrap:wrap}
.v10Quick button{
  min-height:38px;border:1px solid #35414b;border-radius:999px;padding:6px 11px;background:#0c1218;
  color:var(--text);font-weight:850;font-size:12px
}
.v10Quick button:hover,.v10Quick button[aria-pressed="true"]{border-color:#66853e;color:var(--accent)}
.v10Advanced summary{
  cursor:pointer;padding:10px 0;font-weight:850;color:var(--muted);list-style:none
}
.v10Advanced summary::-webkit-details-marker{display:none}
.v10Advanced summary::before{content:"+ ";color:var(--accent)}
.v10Plan{
  border:1px solid #557039;background:
    radial-gradient(circle at 92% 0%,rgba(200,255,85,.12),transparent 38%),#0e160d
}
.v10Plan .mode{font-size:10px;font-weight:950;letter-spacing:.13em;color:var(--accent);text-transform:uppercase}
.v10Plan .name{font-size:26px;font-weight:950;letter-spacing:-.04em;line-height:1.05;margin:5px 0}
.v10Explain{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px
}
.v10Explain>div{padding:9px;border-radius:12px;border:1px solid #344234;background:#0a100a;font-size:11px;line-height:1.35}
.v10Actions{display:grid;grid-template-columns:1.55fr 1fr 1fr;gap:8px;margin-top:12px}
.v10Actions .primary{font-size:15px}
.v10Prediction{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.v10Future{
  border:1px solid #334552;border-radius:15px;padding:11px;background:#0b1218
}
.v10Future .name{font-weight:950;font-size:15px;margin:5px 0}
.v10Future small{color:var(--muted)}
.v10Branch{
  display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px
}
.v10Branch>div{padding:8px;border:1px solid var(--line);border-radius:11px;background:#090e13;font-size:10px}
.v10Guide{border:1px solid #355466;background:#0b141a}
.v10Guide dt{font-weight:900;color:var(--accent2);margin-top:7px}
.v10Guide dd{margin:2px 0 7px;color:var(--muted);font-size:12px;line-height:1.4}
.v10Dock{
  position:fixed;z-index:19;left:50%;transform:translateX(-50%);
  bottom:78px;width:min(788px,calc(100% - 24px));padding:8px;border:1px solid #465645;

function latestSession(){return state.history?.length?state.history[state.history.length-1]:null}
function latestDateForMuscle(m){
  const hs=[...(state.history||[])].reverse();

function daysSinceMuscle(m,date=todayISO()){

}
function weekSetCount(m,date=todayISO(),days=7){

    let gap=daysBetween(date,s.date);
    if(gap>=0&&gap<days){
      for(const e of s.exercises||[]) if((e.muscles||[]).includes(m)) c+=(e.reps?.length||e.sets||0);
    }

}

  if(focus==='lower') pieces.push(`Upper chest ultima esposizione ${daysSinceMuscle('upper_chest',ctx.date)} gg; lower ${daysSinceMuscle('lower',ctx.date)} gg.`);
  if(focus==='upper') pieces.push(`Priorita MASTER: petto alto, spalle, braccia.`);

    return 'full';
  }
  const upperScore=(upperFresh+2)*1.3 + (daysSinceMuscle('arms',ctx.date)+1)*.35 - weekSetCount('upper_chest',ctx.date)*.16;
  const lowerScore=(lowerFresh+2)*1.0 - weekSetCount('lower',ctx.date)*.12;
  if(ctx.tomorrowEvent==='tennis' && lowerScore<upperScore+2) return 'upper';
  return lowerScore>upperScore?'lower':'upper';
}
function ex(k,loc){return deepClone(EXLIB[loc][k])}
function trimForTime(items,time){
  if(time>=55) return items;
  let out=deepClone(items);
  if(time>=40){
    out.forEach((x,i)=>{if(i>=3)x.sets=Math.max(2,Math.min(x.sets,2))});
    return out.slice(0,6);
  }
  if(time>=25){
    return out.slice(0,4).map((x,i)=>({...x,sets:i<2?Math.min(x.sets,3):2}));
  }
  return out.slice(0,3).map(x=>({...x,sets:2}));
}
function buildPlan(ctx){
  const loc=ctx.location;
  const focus=chooseFocus(ctx);
  let label='',items=[],note='';
  if(focus==='gate'){
    return {focus,label:'GATE / NO AUTO-PRESCRIPTION',items:[],note:'Nuovo segnale funzionale importante: non genero una seduta automatica. Valuta il cambiamento; se persiste o e rilevante, serve valutazione clinica.'};
  }
  if(focus==='recovery'){
    return {focus,label:'RECOVERY / AEROBIC BASE',items:[
      {id:'easy_walk',name:'Camminata sostenuta',sets:1,reps:'25-35 min',rir:'RPE 3-4/10',rest:0,loadHint:'Frasi complete',muscles:['conditioning'],note:'No sprint/salite aggressive.'},
      {id:'active_mobility',name:'Mobilita attiva',sets:1,reps:'8-10 min',rir:'facile',rest:0,loadHint:'torace/scapole/anca/caviglia',muscles:['performance'],note:'Niente stretching passivo lungo.'}
    ],note:'Scarico attivo per recupero, non compensazione.'};
  }
  if(focus==='lower'){
    label='LOWER / POSTERIOR PRIORITY';
    items=[ex('knee',loc),ex('hinge',loc),ex('glute',loc),ex('calf',loc),ex('core',loc)];
    if(ctx.time>=55) items.push(ex('rear',loc));
  } else if(focus==='upper'){
    label='UPPER PRIORITY';
    items=[ex('upperChest',loc),ex('shoulderPress',loc),ex('dip',loc),ex('pull',loc),ex('lateral',loc),ex('rear',loc),ex('triceps',loc)];
    if(ctx.elbow<=4 && ctx.time>=60) items.push(ex('biceps',loc));
  } else if(focus==='full'){
    label='FULL BODY PRIORITY';
    items=[ex('knee',loc),ex('upperChest',loc),ex('hinge',loc),ex('pull',loc),ex('shoulderPress',loc),ex('lateral',loc),ex('core',loc)];
  } else if(focus==='microUpper'){
    label='MICRO UPPER PRIORITY';
    items=[ex('upperChest',loc),ex('lateral',loc),ex('triceps',loc)];
    items[0].sets=3; items[1].sets=2; items[2].sets=2;
  } else {
    label='MICRO PULL / SCAPULAR';
    items=[ex('pull',loc),ex('rear',loc)];
    if(ctx.elbow<=4){const b=ex('biceps',loc);b.sets=1;b.rir='3';items.push(b)}
  }
  if(ctx.elbow>=6){
    items=items.filter(x=>!['hammer_curl','weighted_pullup'].includes(x.id));
    items.forEach(x=>{if(x.id==='one_arm_db_row')x.note+=' Gomito alto oggi: se peggiora passa a TRX row o straight-arm pulldown.'});
  }
  items=trimForTime(items,ctx.time);
  return {focus,label,items,note:'MASTER stabile, mezzo adattato a stato/tempo/luogo.'};
}

function calcStatusFromSet(ex,sets){
  const valid=sets.filter(s=>+s.reps>0);
  if(!valid.length) return {status:'HOLD',note:'Nessun set valido registrato.'};
  const pain=Math.max(...valid.map(s=>+s.pain||0));
  const techBad=valid.some(s=>s.tech==='degraded');
  const rirs=valid.map(s=>+s.rir).filter(Number.isFinite);
  const ar=avg(rirs);
  if(pain>=6 || techBad) return {status:'REGRESS',note:'Dolore/tecnica richiedono riduzione o variante diversa.'};
  if(ar!=null && ar>=3) return {status:'ADAPT',note:'Stimolo probabilmente sottocaricato rispetto al target: aumentare carico/difficolta alla prossima comparabile.'};
  const targetTop=parseInt((ex.reps.match(/(\d+)\s*$/)||[])[1]||0);
  const allTop=targetTop && valid.every(s=>+s.reps>=targetTop);
  if(allTop && (ar==null||ar<=2.2)) return {status:'PROMOTE',note:'Top range raggiunto con RIR utile e tecnica preservata: piccolo step successivo.'};
  return {status:'CONSOLIDATE',note:'Esposizione valida: prima consolidare / aggiungere reps comparabili.'};
}

function retroStatus(template,setlog,tech,pain){
  if(pain>=6 || tech==='degraded') return {status:'REGRESS',note:'Retro-entry: dolore/tecnica richiedono cautela o variante.'};
  const rirs=setlog.map(s=>s.rir).filter(Number.isFinite);
  const ar=avg(rirs);
  if(ar!=null && ar>=3) return {status:'ADAPT',note:'Retro-entry: RIR medio alto; probabile margine di carico/difficolta.'};
  if(template && template.reps) return calcStatusFromSet(template,setlog);
  return {status:'CONSOLIDATE',note:'Retro-entry valida; nessuna progressione aggressiva senza target comparabile completo.'};
}
function saveRetroSession(){
  const date=$('#r_date').value;
  if(!date){alert('Inserisci la data.');return}
  const loc=$('#r_loc').value;
  const exercises=[];
  for(const card of $$('.retroCard')){
    const i=card.dataset.r;
    const id=$(`.retroEx[data-r="${i}"]`).value;
    const custom=$(`.retroCustom[data-r="${i}"]`)?.value?.trim()||'';
    const reps=parseSeries($(`.retroReps[data-r="${i}"]`).value);
    const rirs=parseSeries($(`.retroRir[data-r="${i}"]`).value);
    if(!reps.length && id==='custom' && !custom) continue;
    const tpl=knownRetroTemplate(id,loc);
    const nsets=Math.max(reps.length,rirs.length,1);
    const pain=+$(`.retroPain[data-r="${i}"]`).value||0;
    const tech=$(`.retroTech[data-r="${i}"]`).value||'clean';
    const setlog=Array.from({length:nsets},(_,s)=>({
      load:$(`.retroLoad[data-r="${i}"]`).value||'',
      reps:reps[s]??0,
      rir:rirs[s]??null,
      pain,
      tech
    }));
    const name=id==='custom'?(custom||'Esercizio personalizzato'):(tpl?.name||RETRO_OPTIONS.find(x=>x[0]===id)?.[1]||id);
    exercises.push({
      id:id==='custom'?('custom_'+name.toLowerCase().replace(/[^a-z0-9]+/g,'_')):id,
      name,pattern:tpl?.pattern||'custom',muscles:tpl?.muscles||[],
      reps:setlog.map(s=>s.reps),rir:setlog.map(s=>s.rir),pain,tech,
      rom:$(`.retroRom[data-r="${i}"]`).value||'',setlog,
      note:$(`.retroNote[data-r="${i}"]`).value||''
    });
  }
  if(!exercises.length){alert('Inserisci almeno un esercizio.');return}
  const session={
    id:'retro-'+Date.now(),date,location:loc,focus:$('#r_focus').value,
    duration_min:+$('#r_dur').value||null,source:'retroactive_manual',
    post:{fatigue:$('#r_fat').value===''?null:+$('#r_fat').value,quality:$('#r_qual').value===''?null:+$('#r_qual').value,notes:$('#r_notes').value||''},
    exercises
  };
  state.history.push(session);
  state.history.sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  for(const e of exercises){
    const tpl=knownRetroTemplate(e.id,loc);
    const st=retroStatus(tpl,e.setlog,e.tech,e.pain);
    state.ledger[e.id]={status:st.status,note:st.note,lastDate:date};
  }
  const dates=state.history.map(s=>s.date).filter(Boolean).sort();
  if(dates.length) state.settings.last_verified_training_date=dates[dates.length-1];
  const oldSync=state.settings.synced_through_date||'1900-01-01';
  if(String(date)>String(oldSync)) state.settings.synced_through_date=date;
  state.activePlan=null; state.currentCheck=null; save();
  alert('Seduta salvata. Aggiungi eventuali altre sedute mancanti; poi sincronizza a oggi.');
  nav('today');
}

    if(m==='lower'){out.quads=Math.max(out.quads||0,.45);out.posterior=Math.max(out.posterior||0,.35);out.glutes=Math.max(out.glutes||0,.30)}
    else if(m==='arms'){out.biceps=Math.max(out.biceps||0,.45);out.triceps=Math.max(out.triceps||0,.45)}
    else if(CB_MUSCLES[m]) out[m]=1;
  }
  return out;
}
function cbSessionSetCount(e){
  if(Array.isArray(e.setlog)&&e.setlog.some(s=>+s.reps>0)) return e.setlog.filter(s=>+s.reps>0).length;
  if(Array.isArray(e.reps)) return e.reps.filter(x=>typeof x==='number' ? x>0 : !!x).length;
  return +e.sets||0;
}
function cbExerciseQuality(e){
  let rirs=[];
  if(Array.isArray(e.setlog)) rirs=e.setlog.map(s=>s.rir).filter(v=>typeof v==='number'&&isFinite(v));
  if(!rirs.length&&Array.isArray(e.rir)) rirs=e.rir.filter(v=>typeof v==='number'&&isFinite(v));
  const ar=avg(rirs);
  let q=ar==null?.88:(ar<=2?1:(ar<=3?.92:(ar<=4?.72:.55)));
  const pain=typeof e.pain==='number'?e.pain:(Array.isArray(e.setlog)?Math.max(0,...e.setlog.map(s=>+s.pain||0)):0);
  if(pain>=7) q*=.55; else if(pain>=5) q*=.78;
  if(e.tech==='degraded') q*=.70; else if(e.tech==='ok') q*=.90;
  return clamp(q,.30,1.0);
}
function cbCreditsWindow(m,date,days){
  let total=0;
  for(const s of state.history||[]){
    const gap=daysBetween(date,s.date);
    if(gap<0||gap>=days) continue;
    for(const e of s.exercises||[]){
      const meta=CB_META[e.id]||{credits:cbFallbackCredits(e)};
      const w=meta.credits?.[m]||0;
      if(!w) continue;
      total+=cbSessionSetCount(e)*w*cbExerciseQuality(e);
    }

}
function cbLastMuscleExposure(m,date){
  let best=null;

    if(daysBetween(date,s.date)<0) continue;
    let credit=0,qual=0,n=0;
    for(const e of s.exercises||[]){
      const meta=CB_META[e.id]||{credits:cbFallbackCredits(e)};
      const w=meta.credits?.[m]||0;
      if(!w) continue;
      const c=cbSessionSetCount(e)*w*cbExerciseQuality(e);
      credit+=c;qual+=cbExerciseQuality(e);n++;

    if(credit>0 && (!best||s.date>best.date)) best={date:s.date,credit,quality:n?qual/n:.8,session:s};
  }

}
function cbFreshness(days,lastCredit){
  if(days>=5) return 1.08;
  if(days===4) return 1.03;
  if(days===3) return .95;
  if(days===2) return lastCredit<=2?.86:.72;
  if(days===1) return lastCredit<=1.5?.62:.38;
  return .18;
}
function cbFutureOpportunity(){
  const future=(state.calendar||[]).slice(1,4);
  const total=future.reduce((a,d)=>a+(+d.minutes||0),0);
  const full=future.filter(d=>(+d.minutes||0)>=35).length;
  return {minutes:total,full,scarcity:clamp(1-(total/180),0,1)};
}
function cbMuscleStates(ctx){
  const opportunity=cbFutureOpportunity();
  const out={};

    const last=cbLastMuscleExposure(m,ctx.date);
    const days=last?Math.max(0,daysBetween(ctx.date,last.date)):7;
    const s7=cbCreditsWindow(m,ctx.date,7),s14=cbCreditsWindow(m,ctx.date,14);
    const low=cfg.band[0],high=cfg.band[1];
    const deficit=clamp((low-s7)/low,0,1.25);
    const saturation=clamp((s7-high)/Math.max(1,high),0,.8);
    const fresh=cbFreshness(days,last?.credit||0);
    const scarcityBoost=1+opportunity.scarcity*.12;
    const demand=clamp(cfg.priority*(.55*deficit+.45*fresh)*(1-saturation*.65)*scarcityBoost,0,2);
    out[m]={...cfg,lastDate:last?.date||null,days,s7,s14,freshness:fresh,deficit,saturation,demand};
  }
  return out;
}
function cbJointFactor(e,ctx){
  const meta=cbMetaFor(e);
  if(meta.joint==='elbow'){
    if(ctx.elbow>=7) return .08;
    if(ctx.elbow>=5) return .38;
    if(ctx.elbow>=3) return .72;
  }
  if(meta.joint==='knee'){
    // baseline 5/10 is not a stop; penalize only meaningful rise above baseline
    if(ctx.knee>=8) return .15;
    if(ctx.knee>=7) return .55;
    if(ctx.knee>=6) return .82;
  }
  return 1;
}
function cbEventFactor(e,ctx){
  const meta=cbMetaFor(e);
  if(ctx.event==='tennis'){
    const leg=(meta.credits.quads||0)+(meta.credits.posterior||0)+(meta.credits.calves||0);
    const shoulder=meta.credits.shoulders||0;
    return clamp(1-leg*.22-shoulder*.08,.62,1);

}
function cbRecentPatternPenalty(e,ctx){
  let gap=99;

    if((s.exercises||[]).some(x=>x.id===e.id)){gap=daysBetween(ctx.date,s.date);break}
  }
  if(gap<=0) return .15;
  if(gap===1) return .55;

}
function cbCandidateBaseValue(e,ctx,ms){
  const meta=cbMetaFor(e);

  for(const [m,w] of Object.entries(meta.credits||{})){
    if(!ms[m]) continue;
    v+=ms[m].demand*w;
  }
  // performer is an overlay, not the primary objective
  v+=meta.performer*.10;
  v*=cbJointFactor(e,ctx)*cbEventFactor(e,ctx)*cbRecentPatternPenalty(e,ctx);
  return v/Math.max(.55,meta.fatigue);
}
function cbCandidatePool(ctx){
  const loc=ctx.location;
  const keys=['upperChest','shoulderPress','dip','pull','lateral','rear','triceps','biceps','knee','hinge','glute','calf','core'];
  let arr=keys.map(k=>ex(k,loc));
  if(loc==='home' && ctx.elbow<=2){

  if(ctx.elbow>=5) arr=arr.filter(x=>!['hammer_curl','weighted_pullup'].includes(x.id));

}
function cbPlannedCredits(planned,m){
  let c=0;

    c+=(cbMetaFor(p.ex).credits[m]||0)*p.sets;
  }
  return c;
}
function cbMarginalValue(e,setsAlready,planned,ctx,ms){
  const meta=cbMetaFor(e);

  for(const [m,w] of Object.entries(meta.credits||{})){
    if(!ms[m]) continue;
    const plannedM=cbPlannedCredits(planned,m);
    const diminishing=1/(1+.22*plannedM+.20*setsAlready);
    v+=ms[m].demand*w*diminishing;
  }
  v+=meta.performer*.08/(1+.3*setsAlready);
  v*=cbJointFactor(e,ctx)*cbEventFactor(e,ctx)*cbRecentPatternPenalty(e,ctx);
  return v/Math.max(.55,meta.fatigue);

function cbSetLimit(e){
  if(e.id==='hammer_curl') return 2; // recent elbow history: reintroduce direct flexion conservatively even when current pain is 0
  if(['feet_elev_weighted_pushup','back_squat','double_db_squat','barbell_rdl','double_db_rdl'].includes(e.id)) return 4;
  if(['db_ohp','weighted_dips','one_arm_db_row','weighted_pullup','barbell_hip_thrust','db_floor_glute_bridge'].includes(e.id)) return 3;

function cbMinUsefulSets(e){

function cbSetMinutes(e,isFirstSet){

function cbSessionTimeCap(ctx){

function cbComposeLabel(items,ms){

  for(const e of items){

    score.lower+=sets*((meta.credits.quads||0)+(meta.credits.posterior||0)+(meta.credits.glutes||0)+(meta.credits.calves||0));
    score.back+=sets*(meta.credits.back||0);

function cbProgressionHint(e){

function cbSequenceRank(e){

function cbOptimizePlan(ctx){
  if(redFlag(ctx)){
    return {focus:'gate',label:'GATE / NO AUTO-PRESCRIPTION',items:[],estimatedMin:0,
      note:'Nuovo segnale funzionale importante: nessuna prescrizione automatica.',
      analysis:{muscles:cbMuscleStates(ctx),evidence:['Safety gate funzionale.'],personal:[],inference:['Serve chiarire il cambiamento prima di caricare.']}};
  }

  const ms=cbMuscleStates(ctx);
  if(ctx.energy<=2 || ctx.fatigue>=9 || ctx.sleepQ<=2){
    const items=[
      {id:'easy_walk',name:'Camminata sostenuta / cyclette se disponibile',sets:1,reps:'20-30 min',rir:'RPE 3-4/10',rest:0,loadHint:'Conversazionale',muscles:['conditioning'],note:'Recupero attivo, non compensazione.'},
      {id:'active_mobility',name:'Mobilita attiva performer',sets:1,reps:'6-8 min',rir:'facile',rest:0,loadHint:'torace/scapole/anca/caviglia',muscles:['performance'],note:'Qualita, non stretching aggressivo.'}
    ];
    return {focus:'recovery',label:'RECOVERY / PERFORMER BASE',items,estimatedMin:Math.min(ctx.time,35),
      note:'Oggi il costo sistemico domina il valore ipertrofico marginale.',
      analysis:{muscles:ms,evidence:['La seduta viene ridotta quando lo stato globale abbassa il rapporto stimolo/costo.'],personal:[`Energia ${ctx.energy}/10 · fatica ${ctx.fatigue}/10 · sonno ${ctx.sleepQ}/10.`],inference:['Priorita al recupero attivo.']}};
  }

  const pool=cbCandidatePool(ctx);
  const cap=cbSessionTimeCap(ctx);
  const planned=[]; // {ex,sets,time}
  let used=3.5; // brief warm-up / setup budget
  const counts={};
  const chosenIds=new Set();
  let guard=0;

  while(guard++<40){
    let best=null;
    for(const e of pool){
      const count=counts[e.id]||0;
      if(count>=cbSetLimit(e)) continue;
      const first=count===0;
      const dt=cbSetMinutes(e,first);
      if(used+dt>cap) continue;
      let val=cbMarginalValue(e,count,planned,ctx,ms);

      // Avoid collecting one isolated set unless it is continuation of a compound or time is nearly exhausted.
      if(first && cap-used>=6 && cbMinUsefulSets(e)>1) val*=.90;

      // Small pattern-diversity bonus after first meaningful exercise.
      if(first && chosenIds.size>0) val*=1.04;

      // Direct priority muscle bonus; this is the MASTER, not a calendar split.
      const meta=cbMetaFor(e);
      val*=1 + .05*(meta.credits.upper_chest||0) + .04*(meta.credits.shoulders||0) + .03*((meta.credits.biceps||0)+(meta.credits.triceps||0));

      const ratio=val/dt;
      if(!best||ratio>best.ratio) best={e,dt,val,ratio};
    }

    if(!best) break;
    // Stop when extra work has low marginal value; time need not be filled.
    if(planned.length>=2 && best.ratio<.115) break;

    const existing=planned.find(p=>p.ex.id===best.e.id);
    if(existing){existing.sets++; existing.time+=best.dt}
    else planned.push({ex:deepClone(best.e),sets:1,time:best.dt});
    counts[best.e.id]=(counts[best.e.id]||0)+1;
    chosenIds.add(best.e.id);
    used+=best.dt;
  }

  // Remove isolated accessory sets when possible; reinvest only if they are useful.
  for(let i=planned.length-1;i>=0;i--){
    const p=planned[i];
    if(p.sets===1 && cbMinUsefulSets(p.ex)>=2 && planned.length>1){
      used-=p.time; planned.splice(i,1);
    }
  }

  // Ensure at least one viable item if time is very short.
  if(!planned.length){
    const ranked=pool.map(e=>({e,v:cbCandidateBaseValue(e,ctx,ms)})).sort((a,b)=>b.v-a.v);
    if(ranked[0]) planned.push({ex:deepClone(ranked[0].e),sets:Math.min(2,cbSetLimit(ranked[0].e)),time:Math.min(cap,6)});
  }

  const items=planned.map(p=>{
    const e=p.ex;
    e.sets=p.sets;
    e.rir=cbTargetRir(e,ctx);
    e.loadHint=cbProgressionHint(e);
    e.engineValue=Math.round(cbCandidateBaseValue(e,ctx,ms)*100)/100;
    return e;
  }).sort((a,b)=>cbSequenceRank(a)-cbSequenceRank(b) || (b.engineValue||0)-(a.engineValue||0));

  const topMuscles=Object.entries(ms).sort((a,b)=>b[1].demand-a[1].demand).slice(0,4);
  const opportunity=cbFutureOpportunity();
  const personal=[
    `Tempo reale ${ctx.time} min come budget, non come tipo di seduta.`,
    `Luogo ${ctx.location==='home'?'CASA':'TRASFERTA'} · gomito ${ctx.elbow}/10 · ginocchio ${ctx.knee}/10.`,
    `Top domanda: ${topMuscles.map(([m,x])=>`${x.label} ${x.demand.toFixed(2)}`).join(' · ')}.`,
    `Prossime 72h: ${opportunity.minutes} min dichiarati, ${opportunity.full} finestre >=35 min.`
  ];
  const inference=[
    `Selezione per valore marginale stimolo/costo; nessuna sequenza A-B-C-D.`,
    `Il budget puo restare parzialmente inutilizzato se altro volume ha valore marginale basso.`,
    `Performer overlay presente ma subordinato all'ipertrofia MASTER.`
  ];
  if(ctx.event==='show') inference.push('SHOW trattato come carico contestuale lieve, non come blocco automatico.');
  if(ctx.event==='tennis') inference.push('Tennis ricreativo trattato come carico concorrente, non come sport da ottimizzare.');

  return {
    focus:'adaptive',
    label:cbComposeLabel(items,ms),
    items,
    estimatedMin:Math.max(8,Math.round(used)),
    note:`Engine A5: usa circa ${Math.round(used)} dei ${ctx.time} min disponibili in base al valore marginale.`,
    analysis:{
      muscles:ms,
      evidence:[
        'Ipertrofia: serie sufficientemente vicine al cedimento possono aumentare lo stimolo; l’esatta relazione RIR-risposta resta incerta.',
        'Il volume settimanale mostra una relazione dose-risposta con rendimenti decrescenti; frequenza usata soprattutto per distribuire la dose.',
        'Carichi diversi possono supportare ipertrofia; carichi maggiori favoriscono maggiormente la forza massimale.',
        'Concurrent/performance work viene dosato per preservare il fine ipertrofico.'

}

/* =========================================================
   CALIBUILDING v0.4 — PHYSIQUE-FIRST ENGINE A4
   Primary objective: hypertrophy + aesthetics.
   Secondary modalities are eligible only when they improve the

function cbNum(v){
  const n=parseFloat(String(v??'').replace(',','.'));
  return Number.isFinite(n)?n:null;
}
function cbDateDays(a,b){ return daysBetween(a,b); }
function cbLinearSlope(records,key,minN=2,minSpan=7){
  const all=(records||[]).filter(r=>cbNum(r[key])!=null);
  const standardized=all.filter(r=>r.standardized!==false);
  const pts=(standardized.length>=minN?standardized:all).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(pts.length<minN) return null;
  const end=pts[pts.length-1].date;
  const recent=pts.filter(r=>cbDateDays(end,r.date)<=35);
  if(recent.length<minN) return null;
  const start=recent[0].date;
  const span=cbDateDays(end,start);
  if(span<minSpan) return null;
  const x=recent.map(r=>cbDateDays(r.date,start));
  const y=recent.map(r=>cbNum(r[key]));
  const xm=x.reduce((a,b)=>a+b,0)/x.length, ym=y.reduce((a,b)=>a+b,0)/y.length;
  let num=0,den=0;
  for(let i=0;i<x.length;i++){num+=(x[i]-xm)*(y[i]-ym);den+=(x[i]-xm)*(x[i]-xm)}
  if(!den) return null;
  return {perDay:num/den,perWeek:(num/den)*7,n:recent.length,span,start,end};
}
function cbLatestMeasure(key){
  const arr=[...(state.physique?.measurements||[])].filter(r=>cbNum(r[key])!=null).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  return arr.length?cbNum(arr[arr.length-1][key]):null;
}
function cbLedgerPerformanceSignal(){
  const vals=Object.values(state.ledger||{});
  if(!vals.length) return 0;
  let s=0,n=0;
  for(const v of vals){
    if(v.status==='PROMOTE'){s+=1;n++}
    else if(v.status==='REGRESS'){s-=1;n++}
    else if(v.status==='HOLD'){s-=.15;n++}
    else if(v.status==='CONSOLIDATE'){s+=.15;n++}
  }
  return n?s/n:0;
}
function cbPhysiqueSignal(){
  const rec=state.physique?.measurements||[];
  const w=cbLinearSlope(rec,'weight',4,10);
  const waist=cbLinearSlope(rec,'waist',2,10);
  const chest=cbLinearSlope(rec,'chest',2,14);
  const arm=cbLinearSlope(rec,'arm',2,14);
  const thigh=cbLinearSlope(rec,'thigh',2,14);
  const perf=cbLedgerPerformanceSignal();
  const latestW=cbLatestMeasure('weight')||state.profile?.weight_kg||80;
  const weightPctWeek=w&&latestW ? (w.perWeek/latestW)*100 : null;
  const targetSlopes=[chest?.perWeek,arm?.perWeek,thigh?.perWeek].filter(v=>v!=null);
  const targetAvg=targetSlopes.length?targetSlopes.reduce((a,b)=>a+b,0)/targetSlopes.length:null;

  let code='COLLECT';
  let label='RACCOLTA DATI · HYPERTROPHY BASE';
  let reason='Servono trend standardizzati prima di modificare la strategia estetica.';
  if(w && waist){
    if(waist.perWeek<-.12 && perf>=-.10){
      code='RECOMP_FAVORABLE';label='RECOMP TREND FAVOREVOLE';
      reason='Vita in discesa con performance non chiaramente in calo: non serve forzare cambi.';
    }else if(waist.perWeek>.30 && perf<.05 && (targetAvg==null||targetAvg<=.05)){
      code='ENERGY_REVIEW';label='REVISIONE ENERGIA / ADIPOSITA';
      reason='Trend vita crescente senza segnale prestativo o circonferenziale proporzionato: rivedere il bilancio energetico, non tagliare automaticamente.';
    }else if(weightPctWeek!=null && weightPctWeek<-.65 && perf<0){
      code='AVAILABILITY_REVIEW';label='REVISIONE DISPONIBILITA ENERGETICA';
      reason='Perdita di peso rapida associata a performance sfavorevole: evitare di aggiungere ulteriore costo.';
    }else if(waist.perWeek<=.12 && perf>=0){
      code='GROWTH_OK';label='CRESCITA / RECOMP COERENTE';
      reason='Vita sostanzialmente stabile e performance non sfavorevole: mantenere la direzione.';
    }else{
      code='HOLD';label='MANTIENI · CONTINUA A MISURARE';
      reason='I trend non giustificano ancora un cambio di fase.';
    }
  }
  return {code,label,reason,w,waist,chest,arm,thigh,weightPctWeek,targetAvg,perf};
}

function cbIsResistanceExercise(e){
  return !!Object.keys(cbMetaFor(e).credits||{}).length && !['easy_walk','active_mobility'].includes(e.id);
}
function cbResistanceSessions(ctx,days=5){
  return (state.history||[]).filter(s=>{
    const gap=daysBetween(ctx.date,s.date);
    if(gap<0||gap>=days) return false;
    return (s.exercises||[]).some(e=>{
      const m=CB_META[e.id]||{credits:cbFallbackCredits(e)};
      return Object.keys(m.credits||{}).length>0;
    });
  }).length;
}
function cbLastModeDays(ctx,mode){
  for(const s of [...(state.history||[])].reverse()){
    if(daysBetween(ctx.date,s.date)<0) continue;
    const text=(s.focus||'').toUpperCase();
    if(mode==='aerobic' && (text.includes('AEROBIC')||text.includes('INTERVAL')||(s.exercises||[]).some(e=>['easy_aerobic','conditioning_intervals'].includes(e.id)))) return daysBetween(ctx.date,s.date);
    if(mode==='skill' && (text.includes('PERFORMER')||(s.exercises||[]).some(e=>e.id==='active_mobility'))) return daysBetween(ctx.date,s.date);
  }
  return 99;
}
function cbModalityDecision(ctx,ms){
  if(redFlag(ctx)) return {mode:'GATE',why:'Nuovo segnale funzionale importante.'};
  if(ctx.energy<=2||ctx.fatigue>=9||ctx.sleepQ<=2) return {mode:'RECOVERY',why:'Costo sistemico troppo alto per una seduta produttiva.'};

  const demands=Object.values(ms).map(x=>x.demand).sort((a,b)=>b-a);
  const top=demands[0]||0, top3=(demands.slice(0,3).reduce((a,b)=>a+b,0)/Math.max(1,demands.slice(0,3).length));
  const priority=Math.max(ms.upper_chest?.demand||0,ms.shoulders?.demand||0,ms.triceps?.demand||0,ms.biceps?.demand||0);
  const rt5=cbResistanceSessions(ctx,5);
  const future=cbFutureOpportunity();
  const aerobicGap=cbLastModeDays(ctx,'aerobic');
  const phase=cbPhysiqueSignal();

  // Hypertrophy gets first refusal. Secondary work cannot replace unmet resistance demand.
  if(priority>=.52 || top>=.62 || top3>=.50) return {mode:'RESISTANCE',why:'Domanda ipertrofica utile ancora presente.'};
  if(future.scarcity>.55 && top>=.40) return {mode:'RESISTANCE',why:'Poche opportunita nelle prossime 72 h: proteggo la dose ipertrofica.'};

  // If energy availability looks questionable, do not add conditioning cost.
  if(phase.code==='AVAILABILITY_REVIEW') return {mode:'RESISTANCE_LIGHT',why:'Trend fisico/prestativo suggerisce di non aggiungere costo cardiovascolare.'};

  // Intervals are rare and conditional: performer/conditioning benefit, not a fat-loss shortcut.
  if(state.modalities?.intervals_enabled && state.modalities?.running_available &&
     aerobicGap>=10 && rt5>=3 && top<.42 &&
     ctx.energy>=7 && ctx.fatigue<=4 && ctx.sleepQ>=6 &&
     ctx.knee<=5 && daysSinceMuscle('lower',ctx.date)>=2 &&
     ctx.event!=='show'){
    return {mode:'INTERVALS',why:'Dose RT recente adeguata + alta readiness + conditioning trascurato; intervalli scelti per performance, non per sostituire ipertrofia.'};
  }

  if(state.modalities?.easy_aerobic_enabled && aerobicGap>=7 && rt5>=3 && top<.46 && ctx.fatigue<=6 && ctx.energy>=5){
    return {mode:'AEROBIC_EASY',why:'Domanda ipertrofica momentaneamente bassa: lavoro aerobico facile a basso costo.'};
  }

  if(state.modalities?.mobility_skill_enabled && rt5>=3 && top<.44 && ctx.fatigue>=6){
    return {mode:'PERFORMER_RECOVERY',why:'Molto lavoro RT recente e fatica moderata: preservo qualita di movimento senza aggiungere forte costo.'};
  }

  return {mode:'RESISTANCE',why:'Nessuna modalita secondaria supera il valore della resistenza oggi.'};
}
function cbEasyAerobicPlan(ctx,ms,why){
  const mins=Math.min(Math.max(20,ctx.time-6),35);
  return {
    mode:'AEROBIC_EASY',focus:'aerobic_easy',label:'AEROBIC EASY · PERFORMER SUPPORT',
    estimatedMin:Math.min(ctx.time,mins+6),

      {id:'trx_body_saw',name:'TRX Body Saw tecnico',sets:2,reps:'8-12',rir:'3 tecnico',rest:75,loadHint:'Stop prima di perdere controllo.',muscles:['core'],note:'Controllo trunk.'},

    ],

  };

function cbOptimizePlanV4(ctx){
  const ms=cbMuscleStates(ctx);
  const md=cbModalityDecision(ctx,ms);
  let p;
  if(md.mode==='GATE') return cbOptimizePlan(ctx);
  if(md.mode==='RECOVERY') return cbOptimizePlan(ctx);
  if(md.mode==='AEROBIC_EASY') p=cbEasyAerobicPlan(ctx,ms,md.why);
  else if(md.mode==='INTERVALS') p=cbIntervalsPlan(ctx,ms,md.why);
  else if(md.mode==='PERFORMER_RECOVERY') p=cbPerformerRecoveryPlan(ctx,ms,md.why);
  else {
    p=cbOptimizePlan(ctx);
    p.mode='RESISTANCE';
    p.analysis=p.analysis||{};
    p.analysis.personal=[md.why,...(p.analysis.personal||[])];
    p.analysis.inference=[`Modalita scelta: resistance training per massimizzare il MASTER ipertrofia/estetica.`,...(p.analysis.inference||[])];
  }
  const phase=cbPhysiqueSignal();
  p.phase=phase;
  p.analysis=p.analysis||{};
  p.analysis.personal=[...(p.analysis.personal||[]),`Physique phase: ${phase.label}.`];
  if(phase.code==='ENERGY_REVIEW') p.analysis.inference.push('Il training non viene “tagliato” automaticamente: segnalo revisione nutrizione/composizione.');
  if(phase.code==='AVAILABILITY_REVIEW') p.analysis.inference.push('Evito di aggiungere conditioning finche il trend energia/performance non e chiarito.');
  return p;
}

/* =========================================================
   CALIBUILDING v0.5 — END-TO-END ENCRYPTED CLOUD SYNC
   - Sync secret never leaves the browser.
   - Netlify receives only a one-way sync ID and ciphertext.
   - State stays usable offline; pushes are debounced.
   ========================================================= */
const CB_SYNC_TOKEN_KEY='CALIBUILDING_V05_SYNC_SECRET';
const CB_SYNC_ENDPOINT='/.netlify/functions/state-sync';
let CB_SYNC_TIMER=null;
let CB_SYNC_BUSY=false;
let CB_LAST_SYNC_ERROR='';

function cbGetSyncToken(){ return localStorage.getItem(CB_SYNC_TOKEN_KEY)||''; }
function cbSetSyncToken(t){ if(t)localStorage.setItem(CB_SYNC_TOKEN_KEY,t); else localStorage.removeItem(CB_SYNC_TOKEN_KEY); }
function cbHasCloud(){ return !!cbGetSyncToken(); }
function cbBytesToB64(bytes){
  let s='';const u=bytes instanceof Uint8Array?bytes:new Uint8Array(bytes);
  for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode(...u.subarray(i,i+0x8000));
  return btoa(s);
}
function cbB64ToBytes(s){
  const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;
}
function cbHex(bytes){return [...new Uint8Array(bytes)].map(b=>b.toString(16).padStart(2,'0')).join('')}
async function cbDigest(text){
  return crypto.subtle.digest('SHA-256',new TextEncoder().encode(text));
}
async function cbSyncId(token){ return cbHex(await cbDigest('calibuilding-sync-id:v1:'+token)); }
async function cbEncKey(token){
  const raw=await cbDigest('calibuilding-sync-encryption:v1:'+token);
  return crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['encrypt','decrypt']);
}
function cbCloudStateForUpload(){
  const x=deepClone(state);
  x.sync=x.sync||{};
  delete x.sync.token;
  delete x.sync.lastStatus;
  delete x.sync.lastError;
  return x;
}
async function cbEncryptState(token,obj){
  const key=await cbEncKey(token);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const plain=new TextEncoder().encode(JSON.stringify(obj));
  const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);
  return {alg:'A256GCM',iv:cbBytesToB64(iv),data:cbBytesToB64(cipher)};
}
async function cbDecryptState(token,payload){
  const key=await cbEncKey(token);
  const iv=cbB64ToBytes(payload.iv),cipher=cbB64ToBytes(payload.data);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,cipher);
  return JSON.parse(new TextDecoder().decode(plain));
}
function cbGenerateToken(){
  const a=crypto.getRandomValues(new Uint8Array(24));
  return cbBytesToB64(a).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');
}
function cbSyncStatus(text,mode='off'){
  state.sync=state.sync||{};state.sync.lastStatus=text;
  const g=$('#globalSyncChip');if(g){g.textContent='☁ '+text;g.className='chip '+(mode==='on'?'ok':mode==='syncing'?'warn':'')}
  const p=$('#profileSyncStatus');if(p){p.textContent=text;p.className='cloudstatus '+(mode==='on'?'on':mode==='syncing'?'syncing':'off')}
}
function cbScheduleCloudPush(){
  if(CB_REMOTE_APPLY||!cbHasCloud())return;
  clearTimeout(CB_SYNC_TIMER);
  CB_SYNC_TIMER=setTimeout(()=>cbCloudPush(false),1200);
}
async function cbCloudRequest(method,body=null){
  const token=cbGetSyncToken();if(!token)throw new Error('SYNC_NOT_CONFIGURED');
  const id=await cbSyncId(token);
  const init={method,headers:{'X-Cali-Sync-Id':id,'Cache-Control':'no-store'}};
  if(body){init.headers['Content-Type']='application/json';init.body=JSON.stringify(body)}
  const r=await fetch(CB_SYNC_ENDPOINT,init);
  let j=null;try{j=await r.json()}catch{}
  return {r,j};
}
async function cbCloudPush(force=false){
  if(CB_SYNC_BUSY||!cbHasCloud()||!navigator.onLine)return;
  CB_SYNC_BUSY=true;cbSyncStatus('SYNC…','syncing');
  try{
    const token=cbGetSyncToken();
    const encrypted=await cbEncryptState(token,cbCloudStateForUpload());
    const body={
      encrypted,
      clientUpdatedAt:state.sync?.dataUpdatedAt||Date.now(),
      baseRevision:force?null:(state.sync?.cloudRevision||0),
      appVersion:VERSION
    };
    const {r,j}=await cbCloudRequest('PUT',body);
    if(r.status===409 && j?.record){
      await cbResolveCloudConflict(j.record);
      return;
    }
    if(!r.ok) throw new Error(j?.error||('HTTP_'+r.status));
    state.sync.cloudRevision=j.revision||state.sync.cloudRevision||0;
    state.sync.lastCloudUpdatedAt=j.updatedAt||Date.now();
    CB_REMOTE_APPLY=true;cbLocalPersist();CB_REMOTE_APPLY=false;
    CB_LAST_SYNC_ERROR='';cbSyncStatus('SYNC OK','on');
  }catch(e){
    CB_LAST_SYNC_ERROR=String(e.message||e);cbSyncStatus('LOCAL · RETRY','off');
  }finally{CB_SYNC_BUSY=false}
}
async function cbCloudPull({force=false,silent=false}={}){
  if(CB_SYNC_BUSY||!cbHasCloud()||!navigator.onLine)return false;
  CB_SYNC_BUSY=true;if(!silent)cbSyncStatus('SYNC…','syncing');
  try{
    const {r,j}=await cbCloudRequest('GET');
    if(r.status===404){
      CB_SYNC_BUSY=false;
      await cbCloudPush(true);
      return true;
    }
    if(!r.ok)throw new Error(j?.error||('HTTP_'+r.status));
    const token=cbGetSyncToken();
    const remote=await cbDecryptState(token,j.record.encrypted);
    const remoteTs=j.record.clientUpdatedAt||0;
    const localTs=state.sync?.dataUpdatedAt||0;
    if(force || remoteTs>localTs){
      const secret=token;
      state=remote;
      cbEnsureV5State();
      state.sync.cloudRevision=j.record.revision||0;
      state.sync.lastCloudUpdatedAt=j.record.updatedAt||Date.now();
      state.sync.dataUpdatedAt=remoteTs;
      CB_REMOTE_APPLY=true;cbLocalPersist();CB_REMOTE_APPLY=false;
      cbSetSyncToken(secret);
      state.activePlan=null;
      nav(CB_CURRENT_TAB||'today');
    }else if(localTs>remoteTs){
      CB_SYNC_BUSY=false;
      await cbCloudPush(false);
      return true;
    }else{
      state.sync.cloudRevision=j.record.revision||state.sync.cloudRevision||0;
      state.sync.lastCloudUpdatedAt=j.record.updatedAt||state.sync.lastCloudUpdatedAt;
      CB_REMOTE_APPLY=true;cbLocalPersist();CB_REMOTE_APPLY=false;
    }
    CB_LAST_SYNC_ERROR='';cbSyncStatus('SYNC OK','on');return true;
  }catch(e){
    CB_LAST_SYNC_ERROR=String(e.message||e);
    if(!silent)cbSyncStatus('LOCAL · RETRY','off');
    return false;
  }finally{CB_SYNC_BUSY=false}
}
async function cbResolveCloudConflict(record){
  try{
    const token=cbGetSyncToken();
    const remote=await cbDecryptState(token,record.encrypted);
    const localTs=state.sync?.dataUpdatedAt||0;
    const remoteTs=record.clientUpdatedAt||0;
    if(remoteTs>=localTs){
      localStorage.setItem('CALIBUILDING_CONFLICT_BACKUP_'+Date.now(),JSON.stringify(state));
      state=remote;cbEnsureV5State();
      state.sync.cloudRevision=record.revision||0;state.sync.dataUpdatedAt=remoteTs;
      CB_REMOTE_APPLY=true;cbLocalPersist();CB_REMOTE_APPLY=false;
      cbSyncStatus('REMOTE PIÙ RECENTE','on');
      nav('today');
    }else{
      state.sync.cloudRevision=record.revision||0;
      CB_REMOTE_APPLY=true;cbLocalPersist();CB_REMOTE_APPLY=false;
      CB_SYNC_BUSY=false;await cbCloudPush(false);
    }
  }catch(e){CB_LAST_SYNC_ERROR=String(e.message||e);cbSyncStatus('CONFLITTO','off')}
}
async function cbActivateCloud(){
  if(!window.crypto?.subtle){alert('Questo browser non supporta la cifratura richiesta.');return}
  let token=cbGetSyncToken();
  if(!token){token=cbGenerateToken();cbSetSyncToken(token)}
  state.sync=state.sync||{};state.sync.enabled=true;state.sync.dataUpdatedAt=Date.now();
  cbLocalPersist();
  await cbCloudPush(true);
  renderProfile();
}
async function cbConnectCloud(){
  const input=$('#syncTokenInput')?.value.trim();
  if(!input||input.length<20){alert('Incolla il codice Sync completo.');return}
  const previous=cbGetSyncToken();
  cbSetSyncToken(input);
  cbSyncStatus('COLLEGAMENTO…','syncing');
  try{
    const {r,j}=await cbCloudRequest('GET');
    if(r.status===404) throw new Error('CODICE_NON_TROVATO');
    if(!r.ok) throw new Error(j?.error||('HTTP_'+r.status));
    const remote=await cbDecryptState(input,j.record.encrypted);
    state=remote;cbEnsureV5State();
    state.sync.cloudRevision=j.record.revision||0;
    state.sync.lastCloudUpdatedAt=j.record.updatedAt||Date.now();
    state.sync.dataUpdatedAt=j.record.clientUpdatedAt||Date.now();
    CB_REMOTE_APPLY=true;cbLocalPersist();CB_REMOTE_APPLY=false;
    cbSetSyncToken(input);
    CB_LAST_SYNC_ERROR='';
    alert('Dispositivo collegato. Stato cloud caricato.');
    nav('profile');
  }catch(e){
    cbSetSyncToken(previous);
    CB_LAST_SYNC_ERROR=String(e.message||e);
    cbSyncStatus(previous?'SYNC ATTIVO':'NON CONFIGURATO',previous?'on':'off');
    alert(e.message==='CODICE_NON_TROVATO'?'Codice Sync non trovato. Non e stato caricato o creato nulla.':'Non riesco a collegare il cloud. Controlla connessione e codice.');
  }
}

/* =========================================================
   v0.6 SESSION RUNNER
   Coach engine A5 is intentionally unchanged.
   - per-exercise prescribed rest timer
   - set completion -> automatic countdown
   - transition countdown after final set
   - 10-second + finish audio cues
   - draft autosave on every edit
   - active session resume protection
   ========================================================= */

let CB_REST_INT=null;
let CB_AUDIO_CTX=null;
let CB_DRAFT_TIMER=null;

function cbEnsureV6State(){
  cbEnsureV5State();
  state.runner=state.runner||{};
  if(state.runner.audioEnabled===undefined) state.runner.audioEnabled=true;
  state.version=VERSION;
  // Do NOT clear an active workout during an upgrade.
  if(state.activeWorkout){
    state.activeWorkout.logs=state.activeWorkout.logs||{};
    state.activeWorkout.post=state.activeWorkout.post||{};
    state.activeWorkout.timer=state.activeWorkout.timer||null;
  }
}

function cbAudioUnlock(){
  if(!state.runner?.audioEnabled)return;
  try{
    CB_AUDIO_CTX=CB_AUDIO_CTX||new (window.AudioContext||window.webkitAudioContext)();
    if(CB_AUDIO_CTX.state==='suspended')CB_AUDIO_CTX.resume();
  }catch(e){}
}
function cbBeep(freq=880,duration=.11,volume=.07){
  if(!state.runner?.audioEnabled)return;
  try{
    cbAudioUnlock();
    if(!CB_AUDIO_CTX)return;
    const o=CB_AUDIO_CTX.createOscillator(),g=CB_AUDIO_CTX.createGain();
    o.type='sine';o.frequency.value=freq;g.gain.value=volume;
    o.connect(g);g.connect(CB_AUDIO_CTX.destination);
    const t=CB_AUDIO_CTX.currentTime;
    g.gain.setValueAtTime(volume,t);
    g.gain.exponentialRampToValueAtTime(.001,t+duration);
    o.start(t);o.stop(t+duration);
  }catch(e){}
}
function cbCueTen(){cbBeep(760,.10,.075);setTimeout(()=>cbBeep(760,.10,.075),150)}
function cbCueEnd(){cbBeep(980,.16,.085);setTimeout(()=>cbBeep(1180,.22,.085),190)}

function cbTimerRemain(){
  const t=state.activeWorkout?.timer;
  if(!t?.endAt)return 0;
  return Math.max(0,Math.ceil((t.endAt-Date.now())/1000));
}
function cbRestText(sec){return sec?fmt(sec):'—'}
function cbTransitionSec(e){
  // Transition never shortens the prescribed recovery after the final set.
  return Math.max(60,+e.rest||90);
}
function cbStartRest(sec,eidx,sidx,kind='set'){
  if(!state.activeWorkout)return;
  cbAudioUnlock();
  sec=Math.max(1,Math.round(+sec||90));
  state.activeWorkout.timer={
    total:sec,endAt:Date.now()+sec*1000,exerciseIndex:eidx,setIndex:sidx,
    kind,tenCue:false,startedAt:Date.now()
  };
  save();
  cbRunRestTicker();
}
function cbAdjustRest(delta){
  const t=state.activeWorkout?.timer;if(!t)return;
  const remain=cbTimerRemain();
  const next=Math.max(1,remain+delta);
  t.total=Math.max(t.total,next);
  t.endAt=Date.now()+next*1000;
  t.tenCue=false;
  save();cbPaintTimers();
}
function cbStopRest(){
  if(!state.activeWorkout)return;
  state.activeWorkout.timer=null;save();
  clearInterval(CB_REST_INT);CB_REST_INT=null;
  cbPaintTimers();
}
function cbRunRestTicker(){
  clearInterval(CB_REST_INT);
  cbPaintTimers();
  CB_REST_INT=setInterval(()=>{
    const t=state.activeWorkout?.timer;
    if(!t){clearInterval(CB_REST_INT);CB_REST_INT=null;cbPaintTimers();return}
    const r=cbTimerRemain();
    if(r===10&&!t.tenCue){t.tenCue=true;cbLocalPersist();cbCueTen()}
    if(r<=0){
      const kind=t.kind;
      state.activeWorkout.timer=null;cbLocalPersist();
      clearInterval(CB_REST_INT);CB_REST_INT=null;
      cbCueEnd();cbPaintTimers();
      const status=$('#runnerStatus');
      if(status)status.textContent=kind==='transition'?'Recupero completato · passa al prossimo esercizio':'Recupero completato · prossima serie';
      return;
    }
    cbPaintTimers();
  },250);
}
function cbPaintTimers(){
  const w=state.activeWorkout;if(!w)return;
  const t=w.timer,remain=cbTimerRemain();
  w.plan.items.forEach((e,i)=>{
    const panel=$(`#restPanel-${i}`),clock=$(`#restClock-${i}`),bar=$(`#restBar-${i}`),lab=$(`#restLabel-${i}`);
    if(!panel||!clock)return;

function cbA6Median(a){
  const x=(a||[]).filter(Number.isFinite).sort((a,b)=>a-b);
  if(!x.length)return null;
  const m=Math.floor(x.length/2);return x.length%2?x[m]:(x[m-1]+x[m])/2;
}
function cbA6LoadNumber(v){
  if(typeof v==='number'&&isFinite(v))return v;
  const m=String(v??'').replace(',','.').match(/-?\d+(?:\.\d+)?/);
  return m?+m[0]:null;
}
function cbA6PerfIndex(set){
  const reps=+set?.reps;if(!(reps>0))return null;
  const rir=Number.isFinite(+set?.rir)?Math.max(0,+set.rir):2;
  const load=cbA6LoadNumber(set?.load);
  if(load!=null&&load>0) return load*(1+(reps+rir)/30);
  return reps+rir;
}
function cbA6ExposureForExercise(id,date){
  const out=[];

    const e=(s.exercises||[]).find(x=>x.id===id);if(!e)continue;
    const sets=(e.setlog||[]).filter(x=>+x.reps>0);

    out.push({date:s.date,perf,q,pain,tech:e.tech||'clean',postFatigue:+s.post?.fatigue||null,postQuality:+s.post?.quality||null});

}
function cbA6ExerciseModel(id,date){
  const xs=cbA6ExposureForExercise(id,date).slice(-10);
  const n=xs.length;
  if(!n)return {n:0,confidence:0,response:1,factor:1,trend:0,quality:null,painRate:0,label:'BOOTSTRAP'};
  const valid=xs.filter(x=>x.perf!=null);
  let trend=0;
  if(valid.length>=2){

    const base=cbA6Median(prev),last=valid[valid.length-1].perf;
    if(base&&last)trend=clamp(last/base-1,-.25,.25);
  }

  const painRate=xs.filter(x=>x.pain>=6).length/n;
  const degraded=xs.filter(x=>x.tech==='degraded').length/n;
  const raw=clamp(1 + trend*.38 + (quality-.85)*.24 - painRate*.12 - degraded*.10,.82,1.18);
  const span=n>=2?daysBetween(xs[xs.length-1].date,xs[0].date):0;

  const factor=1+confidence*(raw-1);
  return {n,confidence,response:raw,factor,trend,quality,painRate,label:confidence<.30?'LOW':confidence<.65?'MED':'HIGH'};
}
function cbA6MuscleModel(m,date){
  let weighted=0,w=0,confW=0,n=0;
  for(const e of cbCandidatePool({location:'home',elbow:0,knee:5,event:'none'})){
    const credit=cbMetaFor(e).credits?.[m]||0;if(!credit)continue;
    const model=cbA6ExerciseModel(e.id,date);
    if(!model.n)continue;
    const ww=credit*Math.min(1,model.n/3);
    weighted+=model.factor*ww;confW+=model.confidence*ww;w+=ww;n+=model.n;
  }
  if(!w)return {factor:1,confidence:0,n:0,label:'BOOTSTRAP'};
  const confidence=clamp(confW/w,0,.9);
  return {factor:weighted/w,confidence,n,label:confidence<.30?'LOW':confidence<.65?'MED':'HIGH'};
}
function cbA6SystemicReadiness(ctx){

function cbA6MarginalValue(e,setsAlready,planned,ctx,ms){
  const meta=cbMetaFor(e);let v=0;

    if(!ms[m])continue;

    v+=ms[m].demand*w*diminishing;
  }
  v+=meta.performer*.07/(1+.3*setsAlready);
  const model=cbA6ExerciseModel(e.id,ctx.date);
  v*=model.factor;
  v*=cbJointFactor(e,ctx)*cbEventFactor(e,ctx)*cbRecentPatternPenalty(e,ctx);
  return v/Math.max(.55,meta.fatigue);

function cbA6ResistancePlan(ctx,ms,md,light=false){
  const pool=cbCandidatePool(ctx),planned=[],counts={},chosen=new Set();
  let cap=cbSessionTimeCap(ctx)*(light?.78:1);
  cap*=clamp(md.sys.score,.75,1.05);
  cap=Math.max(8,Math.round(cap));
  let used=3.5,guard=0;
  while(guard++<40){
    let best=null;

      const count=counts[e.id]||0;if(count>=cbSetLimit(e))continue;
      const first=count===0,dt=cbSetMinutes(e,first);if(used+dt>cap)continue;
      let val=cbA6MarginalValue(e,count,planned,ctx,ms);
      if(first&&cap-used>=6&&cbMinUsefulSets(e)>1)val*=.90;
      if(first&&chosen.size)val*=1.04;
      const meta=cbMetaFor(e);
      val*=1+.05*(meta.credits.upper_chest||0)+.04*(meta.credits.shoulders||0)+.03*((meta.credits.biceps||0)+(meta.credits.triceps||0));
      const ratio=val/dt;
      if(!best||ratio>best.ratio)best={e,dt,val,ratio};
    }
    if(!best)break;
    const stopThreshold=.112+(md.sys.score<.9?.012:0);
    if(planned.length>=2&&best.ratio<stopThreshold)break;
    const x=planned.find(p=>p.ex.id===best.e.id);
    if(x){x.sets++;x.time+=best.dt}else planned.push({ex:deepClone(best.e),sets:1,time:best.dt});
    counts[best.e.id]=(counts[best.e.id]||0)+1;chosen.add(best.e.id);used+=best.dt;
  }
  for(let i=planned.length-1;i>=0;i--){
    if(planned[i].sets===1&&cbMinUsefulSets(planned[i].ex)>=2&&planned.length>1){used-=planned[i].time;planned.splice(i,1)}
  }
  if(!planned.length){
    const ranked=pool.map(e=>({e,v:cbCandidateBaseValue(e,ctx,ms)})).sort((a,b)=>b.v-a.v);
    if(ranked[0])planned.push({ex:deepClone(ranked[0].e),sets:Math.min(2,cbSetLimit(ranked[0].e)),time:Math.min(cap,6)});
  }
  const items=planned.map(p=>{
    const e=p.ex,m=cbA6ExerciseModel(e.id,ctx.date);
    e.sets=p.sets;e.rir=cbTargetRir(e,ctx);
    e.loadHint=cbProgressionHint(e);
    e.engineValue=Math.round(cbA6MarginalValue(e,0,[],ctx,ms)*100)/100;
    e.a6Model={n:m.n,confidence:m.confidence,factor:m.factor,label:m.label};
    return e;
  }).sort((a,b)=>cbSequenceRank(a)-cbSequenceRank(b)||(b.engineValue||0)-(a.engineValue||0));
  return {mode:'RESISTANCE',focus:'adaptive',label:cbComposeLabel(items,ms),items,estimatedMin:Math.max(8,Math.round(used)),
    note:`Engine A6: ~${Math.round(used)} / ${ctx.time} min. Dose scelta da domanda, recupero, risposta personale e opportunita 72 h.`,
    analysis:{muscles:ms,evidence:[
      'Autoregolazione di carico/volume puo individualizzare la prescrizione; non esiste prova che un singolo algoritmo sia universalmente superiore.',
      'La risposta al resistance training varia tra individui; il modello personale usa shrinkage verso il bootstrap quando i dati sono pochi.',
      'Per ipertrofia, la prossimita al cedimento e il volume utile contano, con rendimenti decrescenti e incertezza individuale.'
    ],personal:[
      md.why,
      `Readiness personale: ${(md.sys.score*100).toFixed(0)}% · baseline energia ${md.sys.baseline.energy.toFixed(1)}, fatica ${md.sys.baseline.fatigue.toFixed(1)}, sonno ${md.sys.baseline.sleepQ.toFixed(1)}.`,
      `72h future: ${md.h.total} min · miglior finestra +${md.h.best.offset}g = ${md.h.best.minutes} min (score ${md.h.best.score.toFixed(2)}).`
    ],inference:[
      'A6 usa i dati individuali solo in proporzione alla confidenza: con pochi dati resta vicino al modello bootstrap.',
      'Il planner confronta costo oggi e opportunita future; non usa split o sequenze fisse.',
      'I coefficienti A6 sono euristiche del software, non soglie biologiche.'

}

function cbA6TargetRirNumber(v){
  const ns=(String(v??'').match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  if(!ns.length)return null;
  if(ns.length>=2)return avg(ns.slice(-2));
  return ns[0];
}
function cbA6EffectiveSets(w,e){return Math.max(1,+w.runtimeCaps?.[e.id]||+e.sets||1)}
function cbA6IntraDecision(w,e,eidx,sidx){
  if(e.nonProgressive)return {action:'CONTINUE',text:'Modalita duration: nessun autoregolatore di set.'};
  const log=w.logs[e.id]?.sets||[],cur=log[sidx]||{};
  const target=cbA6TargetRirNumber(e.rir);
  const pain=+cur.pain||0,tech=cur.tech||'clean',rir=Number.isFinite(+cur.rir)?+cur.rir:null;
  const meta=cbMetaFor(e);
  if(pain>=7||(meta.joint==='elbow'&&pain>=6)||tech==='degraded')
    return {action:'STOP',text:'STOP esercizio: dolore/tecnica hanno superato il limite del runner. Le serie residue vengono rimosse.'};
  const first=log[0]||{},sameLoad=String(first.load??'')===String(cur.load??'');
  if(sidx>=1&&sameLoad&&+first.reps>0&&+cur.reps>0){
    const drop=1-(+cur.reps/+first.reps);
    if(drop>.32&&rir!=null&&target!=null&&rir<=target)
      return {action:'STOP',text:'STOP volume: calo reps >32% a setup comparabile con RIR gia al target/basso.'};
  }
  if(rir!=null&&target!=null){
    if(rir<=Math.max(0,target-1.25)&&sidx<cbA6EffectiveSets(w,e)-1)
      return {action:'ADJUST_DOWN',text:'Prossima serie: riduci leggermente carico/difficolta per rientrare nel target RIR.'};
    if(rir>=target+1.75)
      return {action:'ADJUST_UP',text:'Prossima serie: aumenta il minimo step pratico di carico/difficolta; non aggiungo junk volume.'};
  }
  return {action:'CONTINUE',text:'Risposta nel range: continua la prescrizione.'};
}

  if(x.includes('PERFORMER'))return 'PERFORMER_RECOVERY';
  if(x.includes('RECOVERY'))return 'RECOVERY';
  return 'RESISTANCE';
}
function cbA8ModeModel(mode){
  const hs=(state.history||[]).filter(s=>cbA8ModeFromSession(s)===mode).slice(-8);
  if(!hs.length)return {factor:1,confidence:0,n:0,raw:1};
  const vals=hs.map((s,idx)=>{
    const q=+s.post?.quality||5, f=+s.post?.fatigue||5;
    let next=0;
    const all=state.history||[],pos=all.indexOf(s),nxt=pos>=0?all[pos+1]:null;
    if(nxt?.pre){
      next=.05*((+nxt.pre.energy||6)-6)-.04*((+nxt.pre.fatigue||4)-4)+.03*((+nxt.pre.sleepQ||5)-5);
    }
    return clamp(1 + .055*((q-5)/5) - .045*((f-5)/5) + next,.86,1.14);
  });

function cbA8LastModeDays(ctx,mode){
  const hs=state.history||[];
  for(let i=hs.length-1;i>=0;i--){
    if(cbA8ModeFromSession(hs[i])===mode)return Math.max(0,daysBetween(ctx.date,hs[i].date));
  }

}
function cbA8ExperimentRecently(){
  const arr=state.a8?.experiments||[];

  return completed.length && completed[completed.length-1].historyIndex >= Math.max(0,(state.history||[]).length-4);

const CB_A7_MODE_PROFILE={
  RESISTANCE:{stim:.36,cost:.22,conditioning:.02,performer:.04},
  RESISTANCE_LIGHT:{stim:.24,cost:.13,conditioning:.02,performer:.05},
  CROSSFIT_HYBRID:{stim:.19,cost:.27,conditioning:.25,performer:.18},
  AEROBIC_EASY:{stim:.02,cost:.06,conditioning:.26,performer:.08},
  INTERVALS:{stim:.01,cost:.25,conditioning:.40,performer:.12},
  PERFORMER_RECOVERY:{stim:.01,cost:.05,conditioning:.05,performer:.30},
  RECOVERY:{stim:0,cost:-.10,conditioning:.03,performer:.10}
};
function cbA7Eligibility(mode,ctx,ms,sys,h){
  if(redFlag(ctx))return mode==='GATE';
  const ds=Object.values(ms).map(x=>x.demand).sort((a,b)=>b-a),top=ds[0]||0,top3=avg(ds.slice(0,3))||0;
  if(mode==='RESISTANCE')return ctx.time>=8;
  if(mode==='RESISTANCE_LIGHT')return ctx.time>=15;
  if(mode==='RECOVERY')return ctx.time>=10;
  if(mode==='AEROBIC_EASY')return state.modalities?.easy_aerobic_enabled && ctx.time>=20 && ctx.fatigue<=7;
  if(mode==='PERFORMER_RECOVERY')return state.modalities?.mobility_skill_enabled && ctx.time>=15;
  if(mode==='INTERVALS')return state.modalities?.intervals_enabled && state.modalities?.running_available &&
    ctx.time>=25 && sys.score>=.94 && ctx.energy>=7 && ctx.fatigue<=4 && ctx.sleepQ>=6 &&
    ctx.knee<=5 && ctx.event!=='show' && ctx.event!=='tennis' && cbA8LastModeDays(ctx,'INTERVALS')>=8;
  if(mode==='CROSSFIT_HYBRID')return state.modalities?.crossfit_style_enabled &&
    ctx.time>=35 && sys.score>=.90 && ctx.energy>=5 && ctx.fatigue<=6 &&
    ctx.knee<=5 && ctx.elbow<=3 && ctx.event!=='show' && ctx.event!=='tennis' &&
    cbA8LastModeDays(ctx,'CROSSFIT_HYBRID')>=7 && top<.62 && top3<.54;
  return false;
}
function cbA7Scenario(mode,ctx,ms){
  const sys=cbA6SystemicReadiness(ctx),h=cbA6Horizon(ctx),prof=CB_A7_MODE_PROFILE[mode]||CB_A7_MODE_PROFILE.RESISTANCE;
  const ds=Object.values(ms).map(x=>x.demand).sort((a,b)=>b-a);
  const top=ds[0]||0,top3=avg(ds.slice(0,3))||0;
  const priority=Math.max(ms.upper_chest?.demand||0,ms.shoulders?.demand||0,ms.triceps?.demand||0,ms.biceps?.demand||0);
  const masterDemand=.40*top+.35*top3+.25*priority;
  const conditioningNeed=clamp(cbA8LastModeDays(ctx,'AEROBIC_EASY')/12,0,1);
  const performerNeed=clamp(cbA8LastModeDays(ctx,'PERFORMER_RECOVERY')/10,0,1);
  const mm=cbA8ModeModel(mode);
  let immediate=(prof.stim*masterDemand*2.15)+(prof.conditioning*conditioningNeed*.42)+(prof.performer*performerNeed*.25);
  if(mode==='RECOVERY')immediate+=clamp((.86-sys.score)*.85,0,.35);
  if(mode==='RESISTANCE'&&h.scarcity>.55)immediate+=.10*masterDemand;
  if(mode==='CROSSFIT_HYBRID'&&masterDemand>.48)immediate-=.06; // protect hypertrophy-first logic
  if(mode==='INTERVALS'&&masterDemand>.42)immediate-=.10;

  let projectedReady=clamp(sys.score-prof.cost,.45,1.12);
  let residual=clamp(masterDemand*(1-prof.stim),0,1.5);
  let future=0;

    projectedReady=clamp(projectedReady+.075,.45,1.12);
    const opp=d.score;
    if(opp<=.08)continue;
    const rtValue=opp*projectedReady*residual*.42/(1+.18*(d.offset-1));
    future+=rtValue;
    if(opp>=.45)residual*=.72;

  const fatiguePenalty=Math.max(0,prof.cost)*(.18+.08*masterDemand);
  const score=(immediate+future-fatiguePenalty)*mm.factor;

function cbA7Scenarios(ctx,ms){
  const modes=['RESISTANCE','RESISTANCE_LIGHT','CROSSFIT_HYBRID','AEROBIC_EASY','INTERVALS','PERFORMER_RECOVERY','RECOVERY'];
  return modes.map(m=>cbA7Scenario(m,ctx,ms)).filter(x=>x.eligible).sort((a,b)=>b.score-a.score);

function cbA8ChooseScenario(ctx,ms){
  const sys=cbA6SystemicReadiness(ctx),h=cbA6Horizon(ctx);
  if(redFlag(ctx))return {mode:'GATE',why:'Safety gate funzionale.',sys,h,scenarios:[]};
  if(ctx.energy<=2||ctx.fatigue>=9||ctx.sleepQ<=2||sys.score<.66)
    return {mode:'RECOVERY',why:'Readiness sistemica troppo bassa: recovery domina gli scenari.',sys,h,scenarios:cbA7Scenarios(ctx,ms)};

  const scenarios=cbA7Scenarios(ctx,ms);
  let chosen=scenarios[0]||cbA7Scenario('RESISTANCE',ctx,ms);
  let experiment=null;

  // A8 controlled exploration: at most one modality experiment every ~4 completed sessions,
  // only if an uncertain safe alternative is essentially tied with the exploitation choice.
  if(state.a8?.explorationEnabled && !cbA8ExperimentRecently() && sys.score>=.94 && scenarios.length>1){
    const best=chosen.score;
    const candidates=scenarios.slice(1).filter(x=>
      x.modeModel.confidence<.45 &&
      x.score>=best*.97 &&
      !['RECOVERY','INTERVALS'].includes(x.mode)
    ).sort((a,b)=>(1-b.modeModel.confidence)-(1-a.modeModel.confidence));
    if(candidates[0]){
      const alt=candidates[0];
      experiment={
        id:'exp-'+Date.now(),type:'MODE_EXPLORATION',chosen:alt.mode,control:chosen.mode,
        predictedChosen:alt.score,predictedControl:chosen.score,
        uncertainty:1-alt.modeModel.confidence,status:'PLANNED'
      };
      chosen=alt;
    }

  return {mode:chosen.mode,why:`A7: scenario ${chosen.mode} ha il miglior valore atteso multi-giorno${experiment?' entro margine di esplorazione controllata':''}.`,
    sys,h,scenarios,experiment};
}
function cbA8CrossfitPlan(ctx,ms,md){
  const pool=cbCandidatePool(ctx);
  const ranked=pool.map(e=>({e,v:cbA6MarginalValue(e,0,[],ctx,ms)})).sort((a,b)=>b.v-a.v);
  const anchor=deepClone(ranked.find(x=>['feet_elev_weighted_pushup','db_ohp','weighted_dips','one_arm_db_row','back_squat','double_db_squat','barbell_rdl','double_db_rdl'].includes(x.e.id))?.e||ranked[0]?.e);

function cbOptimizePlanA8(ctx){
  const ms=cbA6MuscleStates(ctx),md=cbA8ChooseScenario(ctx,ms),phase=cbPhysiqueSignal();
  let p;
  if(md.mode==='GATE')p=cbA6GatePlan(ctx,ms,md);
  else if(md.mode==='RECOVERY')p=cbA6RecoveryPlan(ctx,ms,md);
  else if(md.mode==='AEROBIC_EASY')p=cbEasyAerobicPlan(ctx,ms,md.why);
  else if(md.mode==='INTERVALS')p=cbIntervalsPlan(ctx,ms,md.why);
  else if(md.mode==='PERFORMER_RECOVERY')p=cbPerformerRecoveryPlan(ctx,ms,md.why);
  else if(md.mode==='CROSSFIT_HYBRID')p=cbA8CrossfitPlan(ctx,ms,md);
  else p=cbA6ResistancePlan(ctx,ms,md,md.mode==='RESISTANCE_LIGHT');

  p.phase=phase;p.analysis=p.analysis||{};
  p.analysis.a8={sys:md.sys,horizon:md.h,scenarios:md.scenarios||[],experiment:md.experiment};
  p.analysis.personal=p.analysis.personal||[];
  p.analysis.inference=p.analysis.inference||[];
  p.analysis.personal.push(`A7 scenario scelto: ${md.mode}.`);
  p.analysis.inference.push('A7 simula costo oggi + opportunita future; non usa una rotazione fissa.');
  p.analysis.inference.push('A8 calibra il valore delle modalita dai tuoi outcome con shrinkage verso neutro quando i dati sono pochi.');
  if(md.experiment){
    p.experiment=md.experiment;
    p.analysis.inference.push(`A8 controlled exploration: ${md.experiment.chosen} vs ${md.experiment.control}; differenza prevista entro il margine protetto.`);

}

/* =========================================================
   v0.8.1 HOTFIX
   - safe "RIFAI CHECK" from an accidentally opened session
   - exact build/version diagnostics
   - does not touch completed history
   ========================================================= */

function cbActiveWorkoutHasData(){
  const w=state.activeWorkout;
  if(!w)return false;
  try{
    if($('#finishBtn'))captureLogs(); // captures any unsaved visible fields first
  }catch(e){}
  const logs=w.logs||{};
  return Object.values(logs).some(log=>{
    if((log?.note||'').trim())return true;
    return (log?.sets||[]).some(s=>{
      if(!s)return false;
      return !!s.completed ||
        (s.load!==undefined && String(s.load).trim()!=='') ||
        (s.reps!==null && s.reps!==undefined && String(s.reps)!=='') ||
        (s.rir!==null && s.rir!==undefined && String(s.rir)!=='') ||
        (+s.pain||0)>0 ||
        (s.tech && s.tech!=='clean');
    });
  });
}

function cbReturnToCheck(){
  if(!state.activeWorkout){state.activePlan=null;save();renderCheck();return}
  const hasData=cbActiveWorkoutHasData();
  if(hasData){
    const ok=confirm(
      'Hai già inserito dati nella seduta aperta. Tornando al CHECK la seduta NON verrà registrata nello storico. '+
      'Ne conserverò comunque una copia locale di sicurezza. Continuare?'
    );
    if(!ok)return;
  }else{
    const ok=confirm('Annullare questa apertura accidentale e rifare il CHECK? Lo storico già chiuso non verrà toccato.');
    if(!ok)return;
  }

  state.runner=state.runner||{};
  state.runner.cancelledDrafts=state.runner.cancelledDrafts||[];
  state.runner.cancelledDrafts.push({
    cancelledAt:Date.now(),
    reason:'return_to_check',
    workout:deepClone(state.activeWorkout)
  });
  state.runner.cancelledDrafts=state.runner.cancelledDrafts.slice(-3);

  try{clearInterval(CB_REST_INT)}catch(e){}
  state.activeWorkout=null;
  state.activePlan=null;
  save();
  renderCheck();
}

const CB_V9_LOADED_VERSION = state.version || '';

function cbV9DateAdd(date,days){

}
function cbV9DefaultDay(date){

    sleepH:null,sleepQ:5,energy:6,fatigue:4,knee:5,elbow:null,
    newSwelling:false,locking:false,instability:false,functionLoss:false};
}
function cbV9SanitizeEvent(e){return ['none','tennis','show','travel'].includes(e)?e:'none'}
function cbV9LastKnownCheck(beforeDate){
  const ds=Object.values(state.v9?.days||{})
    .filter(d=>d.checkConfirmed && d.date<=beforeDate)
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(ds[0])return ds[0];

function cbV9EnsureDay(date){

function cbV9MigrateLegacyDays(){
  state.v9=state.v9||{};
